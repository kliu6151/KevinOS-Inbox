<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0c0e">
<link rel="icon" href="data:,">
<title>KevinOS</title>
<style>
  /* Dispatch Board: flat asphalt ground, one safety-amber "now" signal,
     ui-monospace as the machine voice for dates/counts/amounts. No gradients,
     no glow, no decorative shadows — sunlight legibility over atmosphere. */
  :root{
    --bg:#0b0c0e; --panel:#141619; --panel2:#141619;
    --border:#24272d; --border2:#343941;
    --text:#edf1f7; --muted:#9aa5b5; --faint:#727d8e;
    --accent:#6aa9ff; --accent-soft:rgba(106,169,255,.12);
    --green:#3ecf8e; --green2:#3ecf8e; --red:#ff5d51; --amber:#ffb020;
    --amber-ink:#191204;
    --shadow:none;
    --shadow-sm:none;
    --radius:12px;
    --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--text); min-height:100vh;
    padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom));
  }
  main{padding:12px 16px;max-width:660px;margin:0 auto}
  .view{display:none}
  .view.active{display:block;animation:rise .22s cubic-bezier(.2,.7,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  button{font-family:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

  /* header */
  .top{display:flex;align-items:baseline;justify-content:space-between;padding:16px 2px 12px}
  .top h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
  .top h1 span{color:var(--accent)}
  .top .sub{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

  /* capture */
  textarea{
    width:100%;min-height:42vh;background:var(--panel);color:var(--text);
    border:1px solid var(--border);border-radius:var(--radius);padding:16px;
    font-size:17px;line-height:1.55;resize:none;outline:none;
    box-shadow:var(--shadow-sm);transition:border-color .15s, box-shadow .2s;
  }
  textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft), var(--shadow-sm)}
  textarea::placeholder{color:var(--faint)}
  .btn{
    margin-top:14px;padding:16px;width:100%;color:#0b1a12;border:none;border-radius:12px;
    font-size:17px;font-weight:650;letter-spacing:.01em;
    background:var(--green);
    transition:transform .12s, filter .15s;
  }
  .btn:active{transform:scale(.98)}
  .btn:disabled{background:var(--panel);color:var(--muted);box-shadow:none;filter:none}
  #status,#ev-status{text-align:center;padding:10px;font-size:14px;color:var(--muted);min-height:38px}
  #status.ok,#ev-status.ok{color:var(--green)} #status.err,#ev-status.err{color:var(--red)}
  .tiny{text-align:center;padding:8px 0}
  .tiny a{color:var(--faint);font-size:12px;text-decoration:none}

  /* sections & items */
  .sec{margin:22px 2px 8px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .card{
    background:var(--panel);
    border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
  }
  /* status rail: every actionable row carries a colored left edge —
     amber = the Must Win (one per screen), green = done, red = overdue, none = queued */
  .item{display:flex;align-items:flex-start;gap:12px;padding:14px 16px 14px 13px;border-bottom:1px solid var(--border);border-left:3px solid transparent;transition:background .12s}
  .item:last-child{border-bottom:none}
  .item.mw{border-left-color:var(--amber)}
  .item.mw:not(.done) .txt{font-size:17px}
  .item.late:not(.done){border-left-color:var(--red)}
  .box{
    flex:none;width:24px;height:24px;margin-top:1px;border:2px solid var(--border2);
    border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-size:14px;color:transparent;transition:background .15s,border-color .15s,transform .15s;
  }
  .item.done{opacity:.6;border-left-color:var(--green)}
  .item.done .txt{text-decoration:line-through}
  .item.done .intent{display:none}
  .item.done .box{background:var(--green);border-color:var(--green);color:#0b1a12;transform:scale(1.05)}
  .txt{font-size:16px;line-height:1.45;flex:1;font-weight:600;letter-spacing:-.005em}
  .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:4px}
  /* concept A: 44px checkbox hit area (visual box stays 24px) */
  .hit{flex:none;padding:10px;margin:-10px;display:flex}
  /* concept A: implementation intention under the task title, never truncated */
  .intent{font-size:14px;line-height:1.5;color:var(--muted);margin-top:4px}
  /* top-3 progress: the shift strip — segments fill amber, green when the day is cleared */
  .prog{display:flex;align-items:center;gap:10px;padding:4px 2px 0}
  .pdots{display:flex;gap:5px}
  .pdot{width:34px;height:6px;border-radius:2px;background:var(--border2)}
  .pdot.on{background:var(--amber)}
  .pdots.all .pdot.on{background:var(--green)}
  .pt{font-family:var(--mono);font-size:12.5px;color:var(--text);font-weight:650;letter-spacing:.05em}
  .ack{margin:10px 0 0;padding:12px 14px;border-radius:10px;font-size:14.5px;font-weight:600;
    color:var(--green);background:rgba(62,207,142,.08);border:1px solid rgba(62,207,142,.35)}
  /* first-move callout: quiet panel, attention only on the edge + label */
  .fm{margin-top:14px;padding:12px 14px;background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--amber);
    border-radius:0 10px 10px 0;font-size:15px;line-height:1.55}
  .fm b{color:var(--amber)}
  /* concept A: read-only rows in the full-plan fold (the interactive copies live above) */
  .ro{display:flex;gap:8px;padding:5px 0;font-size:14.5px;line-height:1.5}
  .ro.done{opacity:.5;text-decoration:line-through}
  .ro .glyph{flex:none;color:var(--faint)}
  .pri1{color:var(--red);font-weight:600}
  .today-badge{color:var(--accent);font-weight:600;font-family:var(--mono);font-size:11px;letter-spacing:.05em}
  .empty{padding:16px;color:var(--muted);font-size:14.5px;line-height:1.5}
  .subsec{padding:11px 14px 5px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--border)}
  .subsec+.item{border-top:none}
  .more{
    display:block;width:100%;padding:13px 14px;background:none;border:none;border-top:1px solid var(--border);
    color:var(--accent);font-size:14px;font-weight:600;text-align:left;
  }
  .note{font-size:15px;line-height:1.6;padding:14px}
  .note .h1{font-weight:700;font-size:16px;margin:8px 0 4px}
  .note .h2{font-family:var(--mono);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:14px 0 4px}
  .note .bullet{padding-left:10px}
  .note .gap{height:8px}

  /* intel briefing stories */
  .intel{padding:15px 14px;border-bottom:1px solid var(--border)}
  .intel:last-child{border-bottom:none}
  .intel .ih{font-weight:700;font-size:15.5px;line-height:1.4}
  .intel .ib{font-size:14.5px;line-height:1.55;color:var(--muted);margin-top:6px}
  .intel .iw{font-size:14.5px;line-height:1.5;margin-top:9px;padding:9px 11px;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 10px 10px 0}
  .intel .iw b{color:var(--accent)}
  .intel .is{font-size:12px;color:var(--faint);margin-top:8px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0}
  .chip{background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:7px 13px;font-size:12.5px}
  .chip b{font-family:var(--mono);color:var(--amber)}

  /* money ledger rows */
  .lwrap{flex:1;display:flex;gap:12px;align-items:flex-start;min-width:0}
  .lmain{flex:1;min-width:0}
  .ljob{font-family:var(--mono);color:var(--faint);font-size:11.5px;font-weight:600;margin-left:7px;white-space:nowrap}
  .lamt{text-align:right;flex:none}
  .amt{font-family:var(--mono);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .age{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:2px}
  .age.warn{color:var(--red);font-weight:600}

  /* collapsible fold */
  .fold{
    display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;padding:13px 14px;
    background:var(--panel);color:var(--text);
    border:1px solid var(--border);border-radius:10px;font-size:15px;font-weight:600;text-align:left;
    transition:border-color .15s;
  }
  .fold .chev{width:16px;height:16px;flex:none;stroke:var(--muted);transition:transform .18s}
  .fold.open .chev{transform:rotate(90deg)}
  .fold .ft{flex:1}
  .fold .fc{font-family:var(--mono);color:var(--muted);font-weight:500;font-size:11.5px;letter-spacing:.03em}
  .fold .fw{font-family:var(--mono);color:var(--red);font-weight:600;font-size:11.5px}
  .foldcard{margin-top:6px}
  /* nested sub-dropdowns (### subsections inside a money section fold) */
  .fold.subfold{margin:10px 10px 0;width:calc(100% - 20px);background:var(--bg);border-radius:8px;font-size:14px;padding:11px 12px}
  .foldcard.subfoldcard{margin:6px 10px 10px;width:calc(100% - 20px);background:var(--bg);border-radius:8px}
  .foldcard.subfoldcard:last-child{margin-bottom:12px}

  /* month calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 12px}
  .cal-head .mon{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .cal-head button{
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    border-radius:12px;width:44px;height:40px;font-size:18px;box-shadow:var(--shadow-sm);
    transition:transform .12s, border-color .15s;
  }
  .cal-head button:active{transform:scale(.94)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dow{text-align:center;font-size:11px;color:var(--faint);font-weight:700;padding:4px 0}
  .cal-cell{
    aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-size:15px;color:var(--text);
    background:transparent;border:1px solid transparent;position:relative;
    transition:background .12s,border-color .12s;
  }
  .cal-cell.dim{color:var(--faint)}
  .cal-cell.today{border-color:var(--accent);font-weight:700}
  .cal-cell.sel{background:var(--accent-soft);border-color:var(--accent)}
  .cal-cell .dot{width:5px;height:5px;border-radius:50%;background:var(--amber);position:absolute;bottom:6px}
  .cal-cell.past-due .dot{background:var(--red)}
  .day-title{margin:18px 2px 8px;font-size:14px;font-weight:700}

  /* detail sheet */
  #sheet-ov,#ev-ov,#pk-ov{
    position:fixed;inset:0;background:rgba(4,6,10,.68);z-index:50;
    display:flex;align-items:flex-end;backdrop-filter:blur(4px);
  }
  #sheet-ov[hidden],#ev-ov[hidden],#pk-ov[hidden]{display:none}
  #sheet,#ev-sheet,#pk-sheet{
    width:100%;background:linear-gradient(180deg,var(--panel),var(--panel2));
    border-radius:22px 22px 0 0;border-top:1px solid var(--border2);
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:75vh;overflow-y:auto;box-shadow:0 -12px 48px rgba(0,0,0,.5);
    animation:sheetUp .28s cubic-bezier(.2,.8,.25,1);
  }
  @keyframes sheetUp{from{transform:translateY(48px);opacity:.5}to{transform:none;opacity:1}}
  #sheet .grab,#ev-sheet .grab,#pk-sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto 16px}
  #sheet-title,.sh-title{font-size:19px;font-weight:700;line-height:1.35;margin-bottom:14px;letter-spacing:-.01em}
  .srow{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:15px}
  .srow .k{color:var(--muted);flex:none;min-width:92px}
  .btn2{
    margin-top:10px;padding:15px;width:100%;background:var(--panel);color:var(--text);
    border:1px solid var(--border);border-radius:14px;font-size:16px;font-weight:600;
    box-shadow:var(--shadow-sm);transition:transform .12s,border-color .15s;
  }
  .btn2:active{transform:scale(.98)}
  .btn2.danger{color:var(--red)}
  .btn.red{background:var(--red);color:#fff}
  /* add-event / cancel-reason form fields */
  .fld{margin-top:12px}
  .fld label{display:block;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .fld input,.fld textarea{
    width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);
    border-radius:10px;padding:12px;font-size:16px;line-height:1.4;outline:none;
    color-scheme:dark;box-shadow:none;transition:border-color .15s;
  }
  .fld input:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:none}
  .fld textarea{min-height:74px}
  .frow{display:flex;gap:10px}
  .frow .fld{flex:1;min-width:0}

  /* outcome bar — sits above the nav; green rail = done, in the Dispatch Board vernacular */
  #outbar{
    position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:45;
    background:var(--panel);border:1px solid var(--border2);border-left:3px solid var(--green);
    border-radius:14px;padding:10px 12px;box-shadow:0 8px 32px rgba(0,0,0,.45);
    opacity:0;transform:translateY(12px);pointer-events:none;
    transition:opacity .2s,transform .2s;
  }
  #outbar.show{opacity:1;transform:none;pointer-events:auto}
  #ob-ask,#ob-edit{display:flex;align-items:center;gap:10px}
  #ob-ask[hidden],#ob-edit[hidden]{display:none}
  .ob-done{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--green);flex:none}
  .ob-q{font-size:14px;color:var(--muted);flex:1;min-width:0}
  #ob-add,#ob-save{
    flex:none;background:none;border:1px solid var(--border2);border-radius:9px;
    padding:8px 13px;color:var(--amber);font-size:13.5px;font-weight:700;
  }
  #ob-skip{flex:none;background:none;border:none;color:var(--faint);font-size:15px;padding:8px 6px}
  #ob-text{
    flex:1;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--border);
    border-radius:9px;padding:10px 12px;font-size:16px;outline:none;color-scheme:dark;
  }
  #ob-text:focus{border-color:var(--accent)}
  @media (min-width:880px){#outbar{left:calc(232px + 24px);right:auto;width:420px;bottom:24px}}

  /* ---- PEAK: health / fitness / recovery ----
     Same Dispatch Board vernacular: flat panels, hairline borders, 3px status rails,
     mono for every number. Nothing here is decorative — if a number can't be explained
     on tap, it doesn't ship. */
  .pk-card{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--border2);border-radius:var(--radius);padding:14px 16px;margin-top:12px}
  .pk-card.amber{border-left-color:var(--amber)}
  .pk-card.green{border-left-color:var(--green)}
  .pk-card.red{border-left-color:var(--red)}
  .pk-eyebrow{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
  .pk-score{display:flex;align-items:baseline;gap:14px}
  .pk-num{font-family:var(--mono);font-size:42px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .pk-den{font-family:var(--mono);font-size:12px;color:var(--faint)}
  .pk-verdict{font-size:16px;font-weight:650;line-height:1.35}
  .pk-detail{font-size:14px;color:var(--muted);line-height:1.5;margin-top:3px}
  .pk-conf{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:4px 8px}
  .pk-conf.tap{cursor:pointer}
  .pk-why{font-size:13.5px;color:var(--muted);line-height:1.5;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
  .pk-btn{margin-top:12px;padding:15px;width:100%;background:var(--amber);color:var(--amber-ink);border:none;border-radius:12px;font-size:16px;font-weight:700;letter-spacing:.01em}
  .pk-btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--border2)}
  .pk-btn:active{transform:scale(.985)}
  /* hair timeline strip */
  .pk-tl{display:flex;align-items:center;gap:0;margin:12px 0 8px}
  .pk-tl .n{width:9px;height:9px;border-radius:50%;background:var(--border2);flex:none}
  .pk-tl .n.on{background:var(--amber)}
  .pk-tl .n.done{background:var(--green)}
  .pk-tl .b{flex:1;height:2px;background:var(--border2)}
  .pk-tl .b.done{background:var(--green)}
  .pk-tlx{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.06em}
  /* metric bars */
  .pk-row{display:flex;align-items:center;gap:10px;padding:7px 0}
  .pk-lab{font-size:14px;color:var(--muted);width:74px;flex:none}
  .pk-bar{flex:1;height:7px;border-radius:4px;background:var(--bg);border:1px solid var(--border);overflow:hidden}
  .pk-fill{height:100%;background:var(--muted)}
  .pk-fill.ok{background:var(--green)}
  .pk-val{font-family:var(--mono);font-size:12.5px;color:var(--text);width:74px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
  /* week dots */
  .pk-week{display:flex;gap:6px;margin-top:8px}
  .pk-day{flex:1;text-align:center}
  .pk-day .d{font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.08em}
  .pk-day .m{width:100%;height:6px;border-radius:2px;background:var(--border2);margin-top:5px}
  .pk-day .m.full{background:var(--green)}
  .pk-day .m.part{background:var(--amber)}
  .pk-day .m.future{background:var(--border)}
  /* rest reads as deliberate (outlined), not as a gap (empty) — it is data, not a miss */
  .pk-day .m.rest{background:transparent;border:1px solid var(--muted)}
  /* exercise rows */
  .pk-ex{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
  .pk-ex:last-child{border-bottom:none}
  .pk-ex .i{font-family:var(--mono);font-size:12px;color:var(--faint);width:16px;flex:none;padding-top:2px}
  .pk-ex .b{flex:1;min-width:0}
  .pk-ex .nm{font-size:15px;font-weight:600;line-height:1.35}
  .pk-ex .pr{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
  .pk-ex .sub{font-size:12.5px;color:var(--faint);margin-top:3px;font-style:italic}
  .pk-swap{flex:none;background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:14px;width:34px;height:34px}
  /* check-in controls */
  .pk-q{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
  .pk-opts{display:flex;gap:8px;flex-wrap:wrap}
  .pk-opt{flex:1;min-width:62px;padding:13px 8px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;font-size:14.5px;font-weight:600;text-align:center}
  .pk-opt.on{background:rgba(255,176,32,.12);border-color:var(--amber);color:var(--amber)}
  .pk-slider{width:100%;margin-top:6px;accent-color:var(--amber)}
  .pk-sliderval{font-family:var(--mono);font-size:22px;font-weight:700;float:right;color:var(--amber)}
  /* set logger */
  .pk-set{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:13.5px}
  .pk-set .k{color:var(--faint);width:44px;flex:none;letter-spacing:.06em}
  .pk-set .v{flex:1}
  .pk-set .ck{color:var(--green)}
  .pk-step{display:flex;align-items:center;gap:6px}

<script>
const OWNER='kliu6151', REPO='KevinOS';
const $=id=>document.getElementById(id);
const enc=s=>btoa(unescape(encodeURIComponent(s)));
const dec=s=>decodeURIComponent(escape(atob(s)));
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const todayStr=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;};
const plusDays=n=>{const d=new Date();d.setDate(d.getDate()+n);const p=x=>String(x).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;};

function token(){
  let t=localStorage.getItem('gh_token');
  if(!t){t=prompt('Paste your GitHub token (one-time setup):');if(t)localStorage.setItem('gh_token',t.trim());}
  return localStorage.getItem('gh_token');
}
$('reset').onclick=e=>{e.preventDefault();localStorage.removeItem('gh_token');token();};

async function api(path,opts={}){
  const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/${path}`,{...opts,headers:{
    'Authorization':`Bearer ${token()}`,'Accept':'application/vnd.github+json',
    ...(opts.body?{'Content-Type':'application/json'}:{})}});
  if(r.status===404)return null;
  if(!r.ok)throw new Error((await r.json().catch(()=>({}))).message||r.status);
  return r.json();
}
/* file fetch with localStorage cache: instant paint from cache, network refresh behind it,
   stale fallback when GitHub is unreachable (job-site LTE) */
let cacheOnly=false,usedStale=false,keepView=false;
const cacheGet=p=>{try{const c=localStorage.getItem('fc_'+p);return c?JSON.parse(c):null;}catch(e){return null;}};
const hasCache=()=>Object.keys(localStorage).some(k=>k.startsWith('fc_'));
async function getFile(path){
  if(cacheOnly)return cacheGet(path);
  try{
    const j=await api(`contents/${path}`);
    if(!j){localStorage.removeItem('fc_'+path);return null;}
    const f={text:dec(j.content.replace(/\n/g,'')),sha:j.sha};
    try{localStorage.setItem('fc_'+path,JSON.stringify({text:f.text,sha:f.sha,ts:Date.now()}));}catch(e){}
    return f;
  }catch(e){
    const c=cacheGet(path);
    if(c){usedStale=true;return{text:c.text,sha:c.sha,stale:true};}
    throw e;
  }
}
function skel(){return '<div class="card">'+[78,52,68,38].map(w=>`<div class="skelrow" style="width:${w}%"></div>`).join('')+'</div>';}

/* ---- checkbox toggle: tolerant line match (ignores \r and edge whitespace) ---- */
const norm=s=>s.replace(/\r/g,'').trim();
/* files where check-off gets a done: stamp + outcome offer — money.md (pipeline owns
   that format, checks are stage advances) and learning/ (progress %) stay untouched */
const outcomeFile=p=>/^(data\/(tasks|loops|calendar)\.md|daily\/)/.test(p);
async function toggleLine(path,line,el,quiet,msg){
  if(el)el.classList.add('done');
  try{
    const f=await getFile(path);
    if(!f)throw new Error('file not found');
    if(f.stale)throw new Error('offline — reconnect and try again');
    const lines=f.text.split('\n');
    const i=lines.findIndex(l=>norm(l)===norm(line));
    if(i<0)throw new Error('item changed elsewhere — pull down to refresh');
    lines[i]=lines[i].replace('- [ ]','- [x]');
    if(outcomeFile(path)&&!/\bdone:\d{4}-\d{2}-\d{2}/.test(lines[i]))lines[i]+=` | done:${todayStr()}`;
    const res=await api(`contents/${path}`,{method:'PUT',body:JSON.stringify({
      message:msg||`done via app: ${norm(line).slice(6,60)}`,sha:f.sha,
      content:enc(lines.join('\n'))})});
    try{localStorage.setItem('fc_'+path,JSON.stringify({text:lines.join('\n'),sha:res.content.sha,ts:Date.now()}));}catch(e){}
    return lines[i]; // the checked+stamped line — offerOutcome appends to THIS text
  }catch(e){
    if(el)el.classList.remove('done');
    if(quiet)console.warn('quiet toggle failed for',path,e.message); // /recap reconciles stragglers
    else alert('Sync failed: '+e.message);
    return false;
  }
}
/* append ' | outcome: …' to an already-checked line (second commit, only if Kevin types) */
async function appendToLine(path,line,suffix,msg,quiet){
  try{
    const f=await getFile(path);
    if(!f)throw new Error('file not found');
    if(f.stale)throw new Error('offline — reconnect and try again');
    const lines=f.text.split('\n');
    const i=lines.findIndex(l=>norm(l)===norm(line));
    if(i<0)throw new Error('item changed elsewhere');
    lines[i]+=suffix;
    const res=await api(`contents/${path}`,{method:'PUT',body:JSON.stringify({
      message:msg||`outcome via app: ${suffix.replace(/^\s*\|\s*/,'').slice(0,60)}`,sha:f.sha,
      content:enc(lines.join('\n'))})});
    try{localStorage.setItem('fc_'+path,JSON.stringify({text:lines.join('\n'),sha:res.content.sha,ts:Date.now()}));}catch(e){}
    return true;

function noteSections(text){

/* presentation-layer dedup: a task/loop is "covered" by a plan line when they share
   ≥2 meaningful tokens AND the overlap is ≥60% of the smaller token set.
   Limitation: a full paraphrase with no shared tokens slips through; two different
   tasks about the same subject can rarely over-match. Source data is never touched. */
const STOPW=new Set(['the','a','an','to','for','of','in','on','re','and','or','with','at','from','by','it','is','are','was','be','before','after','via','per']);
const simTokens=s=>{const set=new Set();for(const w of s.toLowerCase().split(/[^a-z0-9+#]+/)){if(w.length>1&&!STOPW.has(w))set.add(w);}return set;};
/* Compare TITLES, not whole bodies. A Top 3 line carries a long implementation intention
   ("— call her today; if no answer by noon, pick a verdict…") while its loop twin carries
   nudge metadata — full-body comparison could never clear the 60% bar, so the same job
   rendered three times (Top 3 + Due Follow-ups + Needs Attention). The title before the
   em dash is the stable identity. */
const sameThing=(a,b)=>similar(stripMeta(a),stripMeta(b));
function similar(a,b){
  const A=simTokens(a.split(' | ')[0]),B=simTokens(b.split(' | ')[0]);
  if(A.size<2||B.size<2)return false;
  /* CONTAINMENT, not ratio: the shorter title must be (almost) fully inside the longer.
     A ratio rule matched "Con Ed submissions" to "Con Ed rebate auto-filler" on the two
     low-information tokens they share — and a false positive here cascade-checks the
     WRONG task, which is far worse than showing an item twice. One stray token is
     tolerated only on titles long enough (4+) for it to be noise. */
  const S=A.size<=B.size?A:B, Lg=A.size<=B.size?B:A;
  let miss=0;S.forEach(x=>{if(!Lg.has(x))miss++;});
  return (S.size-miss)>=2 && miss<=(S.size>=4?1:0);
}
/* kept for reference: the original ratio test, replaced above */
function similarRatio(a,b){
  const A=simTokens(a.split(' | ')[0]),B=simTokens(b.split(' | ')[0]);
  if(A.size<2||B.size<2)return false;
  let n=0;A.forEach(x=>{if(B.has(x))n++;});
  return n>=2&&n/Math.min(A.size,B.size)>=0.6;
}
// Kevin's own "why it isn't done" note, shown wherever the item shows

/* intel briefing: "**1. Headline**" blocks with body, "**Why it matters:**", "*Source: ...*".
   Tolerant of trailing "(source)" text after the headline's closing ** — routine output drifts. */
function parseIntel(lines){
  const items=[];let cur=null,mode='body';
  for(const raw of lines){
    const line=raw.replace(/\r$/,'').trim();
    if(!line)continue;
    const h=line.match(/^\*\*(\d+)[.)]\s*(.+?)\*\*(.*)$/);
    if(h){
      cur={title:h[2],body:[],why:[],src:''};
      const trail=h[3].trim();
      if(trail){const p=trail.match(/^\((.+)\)$/);if(p)cur.src=p[1];else cur.body.push(trail);}
      items.push(cur);mode='body';continue;
    }
    if(!cur)continue;
    const w=line.match(/^\*\*Why it matters:?\*\*:?\s*(.*)$/i);
    if(w){mode='why';if(w[1])cur.why.push(w[1]);continue;}
    const s=line.match(/^[*_]?Source:\s*(.+?)[*_]?$/i);
    if(s){cur.src=cur.src?cur.src+' · '+s[1]:s[1];mode='body';continue;}
    (mode==='why'?cur.why:cur.body).push(line);
  }
  return items;
}
function intelEl(st){
  const div=document.createElement('div');div.className='intel';
  div.innerHTML=`<div class="ih">${inline(st.title)}</div>`
    +(st.body.length?`<div class="ib">${st.body.map(inline).join('<br>')}</div>`:'')
    +(st.why.length?`<div class="iw"><b>Why it matters:</b> ${st.why.map(inline).join(' ')}</div>`:'')
    +(st.src?`<div class="is">Source: ${esc(st.src)}</div>`:'');

}

    const n=(files||[]).filter(f=>f.type==='file'&&f.name!=='README.md').length;
    $('pending').textContent=n?`${n} awaiting processing`:'inbox clear';
  }catch(e){}
}
save.onclick=async()=>{
  const text=dump.value.trim();
  if(!text){status.textContent='Nothing to save.';return;}
  save.disabled=true;status.className='';status.textContent='Saving…';
  try{
    const d=new Date(),p=n=>String(n).padStart(2,'0');
    const name=`dump-${todayStr()}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
    await api(`contents/inbox/${name}.md`,{method:'PUT',body:JSON.stringify({
      message:`inbox: phone dump`,content:enc(text+'\n')})});
    dump.value='';localStorage.removeItem('draft');
    status.className='ok';status.textContent='✓ Held. Out of your head — sorted on the next /daily.';
    refreshPending();
  }catch(e){status.className='err';status.textContent=`Failed: ${e.message}. Draft kept — try again.`;}
  save.disabled=false;
};

/* ---- TODAY (concept A: progress → top 3 w/ intentions → first move → follow-ups →
        schedule → needs attention (deduped, capped) → intel (folded) → streaks → held → full plan) ---- */
async function renderToday(){
  const body=$('today-body');
  $('today-date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
  if(!keepView)body.innerHTML=skel();
  const t=todayStr(),horizon=plusDays(3),dailyPath=`daily/${t}.md`;
  const [cal,loops,tasks,daily,habits]=await Promise.all([
    getFile('data/calendar.md'),getFile('data/loops.md'),getFile('data/tasks.md'),
    getFile(dailyPath),getFile('data/habits.md')]);
  body.innerHTML='';

  // parse the daily note into ## sections; Intel gets its own fold further down
  const ns=daily?noteSections(daily.text):{pre:[],secs:[]};
  const intelSec=secByName(ns.secs,/^intel\b/i);
  const top3Sec=secByName(ns.secs,/^top 3/i);
  const top3=top3Sec?checkboxLines(top3Sec.lines):[];
  const fmSec=secByName(ns.secs,/^first move/i);
  const dfSec=secByName(ns.secs,/^due follow/i);
  const noteFollowupsAll=dfSec?checkboxLines(dfSec.lines):[];
  const rqSec=secByName(ns.secs,/^rebate submit/i);

  // dedup: anything the plan already covers (Top 3 / due follow-ups) appears ONLY there.
  // Matching tasks/loops are hidden from every other section, and checking the plan item
  // cascades to them (dupCascade). Not shown twice, not checked twice.
  const loopsAll=loops?parseChecklist(loops.text).filter(it=>!it.checked):[];
  const tasksAll=tasks?parseChecklist(tasks.text).filter(it=>!it.checked):[];
  // WITHIN the note: a follow-up the briefing also promoted into Top 3 is the SAME job
  // (e.g. "Pelham permit drop-off" in both). Show it once, in Top 3 — the higher-commitment
  // section — and cascade the check-off to its follow-up twin so the note stays consistent.
  const noteFollowups=noteFollowupsAll.filter(f=>!top3.some(t=>sameThing(t.body,f.body)));
  const echoedFollowups=noteFollowupsAll.filter(f=>top3.some(t=>sameThing(t.body,f.body)));
  const planItems=top3.concat(noteFollowups);
  dupCascade={};
  const hiddenDups=new Set();
  for(const p of planItems){
    const dups=[
      ...tasksAll.filter(it=>sameThing(p.body,it.body)).map(it=>({file:'data/tasks.md',line:it.line})),
      ...loopsAll.filter(it=>sameThing(p.body,it.body)).map(it=>({file:'data/loops.md',line:it.line}))
    ];
    if(dups.length)dupCascade[norm(p.line)]=dups;
    dups.forEach(d=>hiddenDups.add(d.line));
  }
  for(const t of top3){
    const echo=echoedFollowups.filter(f=>sameThing(t.body,f.body)&&!f.checked).map(f=>({file:dailyPath,line:f.line}));
    if(echo.length)dupCascade[norm(t.line)]=(dupCascade[norm(t.line)]||[]).concat(echo);
  }
  const isDup=it=>hiddenDups.has(it.line);

  // top-3 progress (filled by renderProgress; updated in place after each check)
  body.insertAdjacentHTML('beforeend','<div id="prog-wrap"></div>');

  if(!daily){
    body.insertAdjacentHTML('beforeend','<div class="sec">Today\'s Plan</div>');
    const c0=card();body.appendChild(c0);
    empty(c0,'No plan yet. Run <b>/daily</b> in Claude — it sorts every pending dump and hands you Top 3 + first move.');
  }

  // TOP 3 — full implementation intentions, never truncated
  if(top3.length){
    body.insertAdjacentHTML('beforeend','<div class="sec">Top 3</div>');
    const c1=card();body.appendChild(c1);
    top3.forEach((it,i)=>{
      const el=planItem(it,dailyPath);
      if(i===0)el.classList.add('mw'); // the Must Win carries the page's one amber rail
      c1.appendChild(el);
    });
  }

  // FIRST MOVE — the one action that starts the day, above everything secondary
  if(fmSec){
    const fmTxt=fmSec.lines.map(l=>l.trim()).filter(Boolean).map(inline).join('<br>');
    if(fmTxt)body.insertAdjacentHTML('beforeend',`<div class="fm"><b>First move:</b> ${fmTxt}</div>`);
  }
  renderProgress();

  // DUE FOLLOW-UPS from the plan (checkbox lines only; prose stays in the full-plan fold)
  if(noteFollowups.length){
    body.insertAdjacentHTML('beforeend','<div class="sec">Due Follow-ups</div>');
    const cf=card();body.appendChild(cf);
    noteFollowups.forEach(it=>cf.appendChild(planItem(it,dailyPath)));
    if(echoedFollowups.length)cf.insertAdjacentHTML('beforeend',`<div class="subsec" style="border-bottom:none;border-top:1px solid var(--border)">${echoedFollowups.length} more already in Top 3</div>`);
  }

  // REBATE SUBMIT QUEUE (Sundays) — actionable money items stay visible
  if(rqSec&&rqSec.lines.some(l=>l.trim())){
    body.insertAdjacentHTML('beforeend','<div class="sec">Rebate Submit Queue</div>');
    const cq=card();body.appendChild(cq);
    const wq=document.createElement('div');wq.className='note';
    for(const line of rqSec.lines){
      if(!line.trim())continue;
      const m=line.match(/^- \[( |x)\] (.*)$/);
      if(m){cq.appendChild(planItem({line,checked:m[1]==='x',body:m[2]},dailyPath));continue;}
      const e=document.createElement('div');e.innerHTML=inline(line.replace(/^- /,'• '));wq.appendChild(e);
    }
    if(wq.childNodes.length)cq.insertBefore(wq,cq.firstChild);
  }

  // schedule (today + next 3 days), capped at 5
  body.insertAdjacentHTML('beforeend','<div class="sec">Schedule</div>');
  const c2=card();body.appendChild(c2);
  const events=cal?parseChecklist(cal.text).filter(it=>{
    const d=(it.body.match(/(\d{4}-\d{2}-\d{2})/)||[])[1];
    if(it.checked||!d||d<t||d>horizon)return false;
    // untimed reminder lines already covered by the plan don't repeat here; timed appointments always show
    if(!/\d{2}:\d{2}/.test(it.body)&&planItems.some(p=>sameThing(p.body,evTitle(it.body))))return false;
    return true;
  }).sort((a,b)=>a.body.localeCompare(b.body)):[];
  if(!events.length)empty(c2,'Nothing scheduled through '+horizon+'. If that\'s wrong, dump it — dates are sacred here.');
  appendCapped(c2,events,it=>{
    const d=(it.body.match(/(\d{4}-\d{2}-\d{2})( \d{2}:\d{2})?/)||[]);
    const label=d[1]===t?`<span class="today-badge">TODAY${d[2]||''}</span>`:d[0];
    return itemHTML(it,'data/calendar.md',label,evTitle(it.body));
  });

  // NEEDS ATTENTION — plan-covered items are hidden entirely (they live in Top 3);
  // max 3 visible, overflow behind "Also on the radar"
  const dueLoops=loopsAll.filter(it=>!isDup(it)&&(()=>{const n=meta(it.body,'nudge');return n&&n<=t;})());
  const hotTasks=tasksAll.filter(it=>!isDup(it)&&(()=>{const d=meta(it.body,'due');return (d&&d<=t)||meta(it.body,'pri')==='1';})());
  const hot=[
    ...hotTasks.map(it=>({it,file:'data/tasks.md',info:taskMeta(it)})),
    ...dueLoops.map(it=>({it,file:'data/loops.md',info:dueLoopMeta(it)}))
  ];
  const visibleHot=hot.slice(0,3),radar=hot.slice(3);
  body.insertAdjacentHTML('beforeend','<div class="sec">Needs Attention</div>');
  const c3=card();body.appendChild(c3);
  if(!hot.length)empty(c3,hiddenDups.size?'Everything urgent today is already in your Top 3.':'Nothing due. The system is holding your loops — head clear.');
  visibleHot.forEach(h=>c3.appendChild(itemHTML(h.it,h.file,h.info)));
  if(radar.length){
    const fr=fold('Also on the radar',radar.length+' more');
    body.appendChild(fr.head);body.appendChild(fr.card);
    radar.forEach(h=>fr.card.appendChild(itemHTML(h.it,h.file,h.info)));
  }

  // the briefing itself lives on the Brief tab now (Today stays about what Kevin DOES today);
  // one line here so it stays discoverable and Kevin knows whether it's worth the tap
  {
    const mk=secByName(ns.secs,/^markets?\b/i);
    const nI=intelSec?parseIntel(intelSec.lines).length:0, nM=mk?parseIntel(mk.lines).length:0;
    if(nI||nM){
      const b=document.createElement('button');b.className='more';b.style.marginTop='14px';
      b.style.border='1px solid var(--border)';b.style.borderRadius='10px';b.style.background='var(--panel)';
      b.innerHTML=`📰 Today's brief — <b>${nI}</b> industry · <b>${nM}</b> markets <span style="color:var(--faint)">›</span>`;
      b.onclick=()=>document.querySelector('nav button[data-v="brief"]').click();
      body.appendChild(b);
    }
  }

  // habit streaks
  if(habits){
    const hs=habits.text.split('\n').map(l=>l.match(/^- ([^|]+)\|.*streak:(\d+)/)).filter(Boolean);
    if(hs.length){
      body.insertAdjacentHTML('beforeend','<div class="sec">Streaks</div>');
      const chips=document.createElement('div');chips.className='chips';
      hs.forEach(h=>chips.insertAdjacentHTML('beforeend',`<div class="chip">${esc(h[1].trim())} <b>${h[2]}🔥</b></div>`));
      body.appendChild(chips);
    }
  }

  // held pile — everything open that is NOT due yet (and not covered by the plan), collapsed by default
  const heldTasks=tasksAll.filter(it=>!hotTasks.includes(it)&&!isDup(it));
  const heldLoops=loopsAll.filter(it=>!dueLoops.includes(it)&&!isDup(it));
  if(heldTasks.length||heldLoops.length){
    body.insertAdjacentHTML('beforeend','<div class="sec">Held — not lost</div>');
    if(heldTasks.length){
      const f1=fold('Tasks',heldTasks.length+' held');
      body.appendChild(f1.head);body.appendChild(f1.card);
      heldTasks.sort((a,b)=>(meta(a.body,'pri')||'9').localeCompare(meta(b.body,'pri')||'9'));
      groupInto(f1.card,heldTasks,it=>itemHTML(it,'data/tasks.md',taskMeta(it)));
    }
    if(heldLoops.length){
      const f2=fold('Follow-ups',heldLoops.length+' held');
      body.appendChild(f2.head);body.appendChild(f2.card);
      groupInto(f2.card,heldLoops,it=>itemHTML(it,'data/loops.md',loopMeta(it)));
    }
  }

  // FULL PLAN — the note as written, read-only (checkboxes are interactive in the sections above).
  // Opens by default only when the note has no Top 3 to extract, so nothing is ever hidden.
  if(daily){
    body.insertAdjacentHTML('beforeend','<div class="sec">Full Plan</div>');
    const fp=fold('The plan as written','',!top3.length);
    const wp=document.createElement('div');wp.className='note';
    const docLines=[...ns.pre,...ns.secs.filter(s=>s!==intelSec).flatMap(s=>['## '+s.title,...s.lines])];
    for(const line of docLines){
      if(!line.trim()){wp.insertAdjacentHTML('beforeend','<div class="gap"></div>');continue;}
      const m=line.match(/^- \[( |x)\] (.*)$/);
      const e=document.createElement('div');
      if(m){e.className='ro'+(m[1]==='x'?' done':'');e.innerHTML=`<span class="glyph">${m[1]==='x'?'✓':'○'}</span><span>${inline(m[2])}</span>`;}
      else if(line.startsWith('## ')){e.className='h2';e.textContent=line.slice(3);}
      else if(line.startsWith('- ')){e.className='bullet';e.innerHTML='• '+inline(line.slice(2));}
      else e.innerHTML=inline(line);
      wp.appendChild(e);
    }
    fp.card.appendChild(wp);
    body.appendChild(fp.head);body.appendChild(fp.card);
  }
}

/* ---- CALENDAR (month grid + day agenda) ---- */
let calMonth=null,calSel=null,calEvs=[],calVirtual={};
const evDate=it=>(it.body.match(/(\d{4}-\d{2}-\d{2})/)||[])[1];
const evTime=it=>((it.body.match(/\d{4}-\d{2}-\d{2} (\d{2}:\d{2})/)||[])[1])||'';

function drawCal(){
  const body=$('cal-body');body.innerHTML='';
  const t=todayStr();
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const p=n=>String(n).padStart(2,'0');
  const byDay={};calEvs.forEach(it=>{const d=evDate(it);(byDay[d]=byDay[d]||[]).push(it);});
  // Today⇄Cal sync: dated non-calendar items (today's plan, due: tasks, nudge: loops)
  // share the grid and agendas. Presentation-layer only — calVirtual is rebuilt from the
  // source files each render, so the two tabs cannot drift.
  const anyDay=ds=>byDay[ds]||calVirtual[ds];

  // header
  body.insertAdjacentHTML('beforeend',`<div class="cal-head">
    <button id="cal-prev">‹</button>
    <div class="mon">${calMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div>
    <button id="cal-next">›</button></div>`);

  // grid
  const grid=document.createElement('div');grid.className='cal-grid';
  ['S','M','T','W','T','F','S'].forEach(d=>grid.insertAdjacentHTML('beforeend',`<div class="dow">${d}</div>`));
  const first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();
  for(let i=0;i<first.getDay();i++)grid.insertAdjacentHTML('beforeend','<div></div>');
  for(let d=1;d<=days;d++){
    const ds=`${y}-${p(m+1)}-${p(d)}`;
    const cell=document.createElement('button');
    cell.className='cal-cell'+(ds===t?' today':'')+(ds===calSel?' sel':'')+(byDay[ds]&&ds<t?' past-due':'');
    cell.innerHTML=`${d}${anyDay(ds)?'<span class="dot"></span>':''}`;
    cell.onclick=()=>{calSel=ds;drawCal();};
    grid.appendChild(cell);
  }
  body.appendChild(grid);
  $('cal-prev').onclick=()=>{calMonth=new Date(y,m-1,1);drawCal();};
  $('cal-next').onclick=()=>{calMonth=new Date(y,m+1,1);drawCal();};

  // selected day agenda
  const selDate=new Date(calSel+'T00:00');
  body.insertAdjacentHTML('beforeend',`<div class="day-title">${selDate.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}${calSel===t?' — today':''}</div>`);
  const c=card();body.appendChild(c);
  const items=(byDay[calSel]||[]).sort((a,b)=>evTime(a).localeCompare(evTime(b)));
  const virt=calVirtual[calSel]||[];
  if(!items.length&&!virt.length)empty(c,'Nothing this day.');
  items.forEach(it=>{
    let late=calSel<t?'<span class="pri1">past — reschedule or check off</span>':evTime(it);
    const st=stuckBit(it);if(st)late+=(late?' · ':'')+st;
    c.appendChild(itemHTML(it,'data/calendar.md',late,evTitle(it.body)));
  });
  virt.forEach(v=>c.appendChild(itemHTML(v.it,v.file,v.label)));

  const add=document.createElement('button');
  add.className='btn2';add.textContent='＋ Add event';
  add.onclick=()=>openEvForm(calSel);
  body.appendChild(add);

  // missed (before today) — decide, don't ignore
  const missed=calEvs.filter(it=>evDate(it)<t);
  if(missed.length){
    body.insertAdjacentHTML('beforeend','<div class="sec">Missed — decide</div>');
    const mc=card();body.appendChild(mc);
    appendCapped(mc,missed,it=>{
      const st=stuckBit(it);
      return itemHTML(it,'data/calendar.md',`<span class="pri1">was ${evDate(it)}</span>`+(st?' · '+st:''),evTitle(it.body));
    });
  }

  // upcoming agenda (next 30 days), events + dated plan/due/nudge items, capped at 8
  const horizon=plusDays(30);
  const merged=calEvs.filter(it=>{const d=evDate(it);return d>=t&&d<=horizon;})
    .map(it=>({d:evDate(it),time:evTime(it),it,file:'data/calendar.md',title:evTitle(it.body),meta:null}));
  for(const [d,vs] of Object.entries(calVirtual)){
    if(d<t||d>horizon)continue;
    vs.forEach(v=>merged.push({d,time:'',it:v.it,file:v.file,title:null,meta:v.label}));
  }
  merged.sort((a,b)=>(a.d+a.time).localeCompare(b.d+b.time));
  body.insertAdjacentHTML('beforeend','<div class="sec">Next 30 Days</div>');
  const uc=card();body.appendChild(uc);
  if(!merged.length)empty(uc,'Nothing coming up. Dump anything with a date and it lands here.');
  let lastD='';
  const rows=merged.map(r=>{
    const label=(r.d!==lastD?new Date(r.d+'T00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}):'')+(r.time?' '+r.time:'');
    lastD=r.d;
    const shown=r.d===t?`<span class="today-badge">TODAY</span>${r.time?' '+r.time:''}`:label;
    return {...r,label:r.meta?shown+(shown?' · ':'')+r.meta:shown};
  });
  appendCapped(uc,rows,r=>itemHTML(r.it,r.file,r.label,r.title||undefined),8);
}

async function renderCal(){
  const body=$('cal-body');if(!keepView)body.innerHTML=skel();
  const t=todayStr(),dailyPath=`daily/${t}.md`;
  const [f,tk,lp,dl]=await Promise.all([
    getFile('data/calendar.md'),getFile('data/tasks.md'),getFile('data/loops.md'),getFile(dailyPath)]);
  calEvs=f?parseChecklist(f.text).filter(it=>!it.checked&&it.body.match(/\d{4}-\d{2}-\d{2}/)):[];
  // Today⇄Cal sync (2026-07-20): the calendar is the date-lens over EVERYTHING dated —
  // today's plan items land on today, tasks land on their due: date, loops on their
  // nudge: date. Rebuilt from source files each render; nothing is written anywhere.
  // Past-due items stay OFF the calendar — Today's Needs Attention already owns them.
  calVirtual={};
  const add=(d,it,file,label)=>{(calVirtual[d]=calVirtual[d]||[]).push({it,file,label});};
  const plan=[];
  if(dl){
    const ns=noteSections(dl.text);
    const s3=secByName(ns.secs,/^top 3/i),df=secByName(ns.secs,/^due follow/i);
    [...(s3?checkboxLines(s3.lines):[]),...(df?checkboxLines(df.lines):[])]
      .filter(x=>!x.checked).forEach(x=>{plan.push(x);add(t,x,dailyPath,'<span class="today-badge">PLAN</span>');});
  }
  const covered=b=>plan.some(p=>sameThing(p.body,b)); // plan-covered items show once, as PLAN
  if(tk)parseChecklist(tk.text).filter(it=>!it.checked).forEach(it=>{
    const d=meta(it.body,'due');if(d&&d>=t&&!covered(it.body))add(d,it,'data/tasks.md',taskMeta(it));});
  if(lp)parseChecklist(lp.text).filter(it=>!it.checked).forEach(it=>{
    const n=meta(it.body,'nudge');if(n&&n>=t&&!covered(it.body))add(n,it,'data/loops.md',loopMeta(it));});
  $('cal-count').textContent=calEvs.length?calEvs.length+' scheduled':'';
  if(!calMonth){calMonth=new Date();calMonth.setDate(1);calSel=todayStr();}
  drawCal();
}

/* ---- manual add/edit event: writes a standard checkbox line into calendar.md's
   ## Upcoming section (date-sorted), so check-off and the sheet work unchanged.
   Edit mode (it passed) pre-fills from the line and rewrites it in place,
   preserving meta segments the form doesn't own (type:, prep, …) ---- */
let evEditCtx=null;
function openEvForm(dateStr,it){
  evEditCtx=null;
  if(it){
    const segs=it.body.split('|').map(s=>s.trim()).slice(1);
    evEditCtx={line:it.line,extras:segs.filter(s=>s&&!/^(where|notes)\s*:/i.test(s))};
    $('ev-title').value=evTitle(it.body);
    $('ev-date').value=evDate(it)||todayStr();
    $('ev-time').value=evTime(it);
    $('ev-addr').value=meta(it.body,'where');
    $('ev-desc').value=meta(it.body,'notes');
  }else{
    $('ev-title').value='';$('ev-time').value='';$('ev-addr').value='';$('ev-desc').value='';
    $('ev-date').value=dateStr||todayStr();
  }
  document.querySelector('#ev-sheet .sh-title').textContent=it?'Edit event':'Add event';
  $('ev-save').textContent=it?'Save changes':'Add to calendar';
  $('ev-status').textContent='';$('ev-status').className='';
  $('ev-save').disabled=false;
  $('ev-ov').hidden=false;
  setTimeout(()=>$('ev-title').focus(),60);
}
$('ev-close').onclick=()=>{$('ev-ov').hidden=true;};
$('ev-ov').onclick=e=>{if(e.target.id==='ev-ov')$('ev-ov').hidden=true;};
$('ev-save').onclick=async()=>{
  const clean=s=>s.trim().replace(/\s*\n\s*/g,'; ').replace(/\|/g,'/'); // '|' and newlines would break the line format
  const title=clean($('ev-title').value),date=$('ev-date').value,time=$('ev-time').value,
        addr=clean($('ev-addr').value),desc=clean($('ev-desc').value),st=$('ev-status');
  if(!title){st.className='err';st.textContent='Give it a name.';return;}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){st.className='err';st.textContent='Pick a date.';return;}
  $('ev-save').disabled=true;st.className='';st.textContent='Saving…';
  const extras=evEditCtx&&evEditCtx.extras.length?' | '+evEditCtx.extras.join(' | '):'';
  const line=`- [ ] ${date}${time?' '+time:''} — ${title}${addr?` | where: ${addr}`:''}${desc?` | notes: ${desc}`:''}${extras}`;
  try{
    if(evEditCtx)await updateCalLine(evEditCtx.line,line,title);
    else await addCalLine(line,title);
    $('ev-ov').hidden=true;
    calSel=date;calMonth=new Date(+date.slice(0,4),+date.slice(5,7)-1,1);
    runRender(currentView);
  }catch(e){st.className='err';st.textContent='Failed: '+e.message;}
  $('ev-save').disabled=false;
};
async function updateCalLine(oldLine,line,title){
  const path='data/calendar.md';
  const f=await getFile(path);
  if(!f)throw new Error('calendar file not found');
  if(f.stale)throw new Error('offline — reconnect and try again');
  const lines=f.text.split('\n');
  const i=lines.findIndex(l=>norm(l)===norm(oldLine));
  if(i<0)throw new Error('item changed elsewhere — pull down to refresh');
  lines[i]=line;
  const res=await api(`contents/${path}`,{method:'PUT',body:JSON.stringify({
    message:`cal: edit via app — ${title.slice(0,60)}`,sha:f.sha,
    content:enc(lines.join('\n'))})});
  try{localStorage.setItem('fc_'+path,JSON.stringify({text:lines.join('\n'),sha:res.content.sha,ts:Date.now()}));}catch(e){}
}
async function addCalLine(line,title,msg){
  const path='data/calendar.md';
  const f=await getFile(path);
  if(!f)throw new Error('calendar file not found');
  if(f.stale)throw new Error('offline — reconnect and try again');
  const lines=f.text.split('\n');
  const s=lines.findIndex(l=>/^## Upcoming/.test(l));
  if(s<0)lines.push(line);
  else{
    let end=lines.length;
    for(let j=s+1;j<lines.length;j++)if(lines[j].startsWith('## ')){end=j;break;}
    let ins=end;
    while(ins>s+1&&!lines[ins-1].trim())ins--; // stay inside the section, above its trailing blanks
    const d=line.match(/\d{4}-\d{2}-\d{2}/)[0];
    for(let j=s+1;j<ins;j++){
      const m=lines[j].match(/^- \[[ x~]\] (\d{4}-\d{2}-\d{2})/);
      if(m&&m[1]>d){ins=j;break;}
    }
    lines.splice(ins,0,line);
  }
  const res=await api(`contents/${path}`,{method:'PUT',body:JSON.stringify({
    message:msg||`cal: add via app — ${title.slice(0,60)}`,sha:f.sha,
    content:enc(lines.join('\n'))})});
  try{localStorage.setItem('fc_'+path,JSON.stringify({text:lines.join('\n'),sha:res.content.sha,ts:Date.now()}));}catch(e){}
}

/* ---- MONEY (money.md as a ledger: name left, amount right, aging badge) ---- */
const AMT_RE=/\$[\d,]+(?:\.\d{1,2})?/g;
const parseAmt=a=>parseFloat(a.replace(/[$,]/g,''));
const fmtAmt=v=>'$'+Math.round(v).toLocaleString();
const compactAmt=v=>v>=1e6?'$'+(v/1e6).toFixed(2)+'M':v>=1e3?'$'+Math.round(v/1e3)+'k':fmtAmt(v);

/* pipe-delimited money line → structured ledger row */
function ledgerRow(line){
  const cm=line.match(/^- \[( |x)\] (.*)$/);
  const body=cm?cm[2]:line.replace(/^- /,'');
  const it={line,checked:cm?cm[1]==='x':false,body};
  const parts=body.split(' | ').map(s=>s.trim());
  let head=parts[0],amt=0,age='',warn=false;
  const amts=(head.match(AMT_RE)||[]).map(parseAmt);
  if(amts.length){amt=amts.reduce((a,b)=>a+b,0);head=head.replace(AMT_RE,'').replace(/\s{2,}/g,' ').replace(/\s\+\s*$/,'').trim();}
  const metaBits=[];
  for(const seg of parts.slice(1)){
    const am=seg.match(/^(\d+)d( ⚠)?$/);
    if(am){age=am[1]+'d';warn=!!am[2];continue;}
    const gm=seg.match(/^gross (\$[\d,]+(?:\.\d{1,2})?)/);
    if(gm&&!amt){amt=parseAmt(gm[1]);continue;}
    if(seg&&seg!=='—')metaBits.push(seg);
  }
  // "Name — program" split, then pull a leading "#1234" / "Est #1234" into a chip
  let name=head,sub='';
  const di=head.indexOf(' — ');
  if(di>0){name=head.slice(0,di);sub=head.slice(di+3).replace(/\s\+\s*$/,'').trim();}
  let chip='';
  const jm=name.match(/^(Est\s+)?#(\S+)\s*(.*)$/);
  if(jm){chip=(jm[1]?'Est ':'')+'#'+jm[2];name=jm[3].trim()||chip;if(name===chip)chip='';}
  if(sub)metaBits.unshift(sub);

  const div=document.createElement('div');
  div.className='item'+(it.checked?' done':'');
  div.innerHTML=`${cm?'<div class="hit"><div class="box">✓</div></div>':''}<div class="lwrap"><div class="lmain"><div class="txt">${esc(name)}${chip?`<span class="ljob">${esc(chip)}</span>`:''}</div>${metaBits.length?`<div class="meta">${esc(metaBits.join(' · '))}</div>`:''}</div>${(amt||age)?`<div class="lamt">${amt?`<div class="amt">${fmtAmt(amt)}</div>`:''}${age?`<div class="age${warn?' warn':''}">${age}${warn?' ⚠':''}</div>`:''}</div>`:''}</div>`;
  if(cm&&!it.checked){
    div.querySelector('.hit').onclick=e=>{e.stopPropagation();toggleLine('data/money.md',it.line,div).then(ok=>{if(ok)afterToggle('data/money.md');});};
    div.onclick=()=>openSheet(it,'data/money.md',name+(chip?' '+chip:''));
  }
  return div;
}
function moneyLineEl(line){
  if(line.startsWith('- ')&&line.includes(' | '))return ledgerRow(line); // top-level structured → ledger row
  const m=line.match(/^- \[( |x)\] (.*)$/);
  if(m)return itemHTML({line,checked:m[1]==='x',body:m[2]},'data/money.md');
  const el=document.createElement('div');
  if(line.startsWith('- ')){el.className='note bullet';el.textContent='• '+line.slice(2);}
  else{el.className='note';el.style.padding='4px 14px';el.innerHTML=esc(line).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/_(.+?)_/g,'<i>$1</i>');}
  return el;
}
async function renderMoney(){
  const body=$('money-body');
  // remember which folds the user opened/closed so a check-off re-render doesn't collapse them
  const prevFolds=new Map([...body.querySelectorAll('.fold')].map(h=>[h.querySelector('.ft').textContent,h.classList.contains('open')]));
  if(!keepView)body.innerHTML=skel();
  const [f,ops]=await Promise.all([getFile('data/money.md'),getFile('data/ops-status.md')]);body.innerHTML='';
  // ⚙ Ops status — script-written watch feed for the local money routines
  // (ops/ops-status.js, refreshed by the daily 8:30 ACH check). Read-only;
  // buttons stay on the desktop console.
  if(ops){
    const lines=ops.text.split('\n').map(l=>l.replace(/\r$/,'')).filter(l=>l.startsWith('- ')||l.startsWith('## '));
    const warn=lines.filter(l=>/⚠|🔴/.test(l)).length;
    const upd=((lines.find(l=>l.startsWith('- updated:'))||'').split('updated:')[1]||'').trim();
    const open=prevFolds.has('⚙ Ops status')?prevFolds.get('⚙ Ops status'):warn>0;
    const of=fold('⚙ Ops status',upd,open,warn);
    for(const l of lines){
      if(l.startsWith('- updated:'))continue;
      if(l.startsWith('## ')){const h=document.createElement('div');h.className='note';h.style.padding='6px 14px 2px';h.innerHTML='<b>'+esc(l.slice(3))+'</b>';of.card.appendChild(h);continue;}
      of.card.appendChild(moneyLineEl(l));
    }
    body.appendChild(of.head);body.appendChild(of.card);
  }
  if(!f){const c=card();body.appendChild(c);empty(c,'No money.md yet — the weekend pipeline builds it.');return;}
  // split into preamble + ## sections
  const secs=[];let pre=[],cur=null;
  for(const raw of f.text.split('\n')){
    const line=raw.replace(/\r$/,'');
    if(line.startsWith('## ')){cur={title:line.slice(3),lines:[]};secs.push(cur);continue;}
    if(line.startsWith('# ')||!line.trim())continue;
    (cur?cur.lines:pre).push(line);
  }
  if(pre.length){const pc=card();body.appendChild(pc);pre.forEach(l=>pc.appendChild(moneyLineEl(l)));}
  const openByDefault=t=>/this month/i.test(t);
  secs.forEach(s=>{
    const open=prevFolds.has(s.title)?prevFolds.get(s.title):(/status:/i.test(s.title)||openByDefault(s.title));
    const openLines=s.lines.filter(l=>l.startsWith('- [ ]'));
    const nWarn=openLines.filter(l=>l.includes('⚠')).length;   // only count warnings still open
    const total=openLines.reduce((sum,l)=>sum+((l.split(' | ')[0].match(AMT_RE)||[]).map(parseAmt).reduce((a,b)=>a+b,0)),0);
    const label=openLines.length?openLines.length+' open'+(total?' · '+compactAmt(total):''):'';
    const sf=fold(s.title,label,open,nWarn);
    // '### ' subsections (HPWH serials) render as nested sub-dropdowns inside the section fold
    const subs=[];let pre2=[],cur2=null;
    for(const l of s.lines){
      if(l.startsWith('### ')){cur2={title:l.slice(4).trim(),lines:[]};subs.push(cur2);continue;}
      (cur2?cur2.lines:pre2).push(l);
    }
    if(!subs.length)appendCapped(sf.card,s.lines,moneyLineEl,12);
    else{
      pre2.forEach(l=>sf.card.appendChild(moneyLineEl(l)));
      subs.forEach(sub=>{
        const subOpen2=sub.lines.filter(l=>l.startsWith('- [ ]'));
        const w2=subOpen2.filter(l=>l.includes('⚠')).length;
        const lbl=sub.lines.filter(l=>l.startsWith('- [')).length?(subOpen2.length?subOpen2.length+' open':sub.lines.filter(l=>l.startsWith('- [x]')).length+' done'):'';
        const isOpen=prevFolds.has(sub.title)?prevFolds.get(sub.title):/needs serial/i.test(sub.title);
        const sf2=fold(sub.title,lbl,isOpen,w2);
        sf2.head.classList.add('subfold');sf2.card.classList.add('subfoldcard');
        appendCapped(sf2.card,sub.lines,moneyLineEl,12);
        sf.card.appendChild(sf2.head);sf.card.appendChild(sf2.card);
      });
    }
    body.appendChild(sf.head);body.appendChild(sf.card);
  });
}
