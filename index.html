/* ================= PEAK KEVIN =================
   Health / fitness / recovery module. Spec: KevinOS docs/peak-kevin/.

   SYNC NOTE: the pure decision functions below (pkPhase / pkHair / pkRecovery /
   pkNutrition / pkRunning) mirror ops/peak/peak-lib.js in the DATA repo, which the
   Sunday review runs. The app has no build step and cannot import from that repo, so
   the two copies must be changed together — canonical rules live in
   docs/peak-kevin/ENGINES.md and are covered by ops/peak/selftest.js.

   The WORKOUT GENERATOR (pkGenerate) lives here ONLY, on purpose: it must run offline
   on job-site LTE, instantly, and reproducibly. An LLM round-trip would be slow, would
   fail in a basement, and would make the strength trend meaningless.

   PRIVACY: this repo is PUBLIC. No dose, medication name, health default, or personal
   metric is hardcoded here — everything renders from the private repo's data files.
   Keep it that way. */
const PK={cfg:null,proto:null,ex:null,tpl:null,run:null,meals:{},days:{},metrics:[],hairLines:[],cal:[],loaded:false};
const PKF={cfg:'data/peak/config.json',proto:'data/peak/hair/protocol.json',ex:'data/peak/library/exercises.json',
  tpl:'data/peak/library/templates.json',run:'data/peak/library/running.json',meals:'data/peak/library/meals.json',
  metrics:'data/peak/progress/metrics.md',hair:'data/peak/hair/log.md'};
const pkMonth=d=>d.slice(0,7);
const pkAdd=(s,n)=>{const[y,m,dd]=s.split('-').map(Number);const d=new Date(Date.UTC(y,m-1,dd,12));d.setUTCDate(d.getUTCDate()+n);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;};
const pkDiff=(a,b)=>Math.round((new Date(a+'T12:00:00Z')-new Date(b+'T12:00:00Z'))/864e5);
const PKDOW=['sun','mon','tue','wed','thu','fri','sat'];
const pkDow=s=>PKDOW[new Date(s+'T12:00:00Z').getUTCDay()];
const pkMonday=s=>pkAdd(s,-((new Date(s+'T12:00:00Z').getUTCDay()+6)%7));

/* date expressions: id is LAZY — milestone ids contain '-' ("prospect-half"), so a greedy
   id swallows the offset in "prospect-half-16w" and silently resolves to null */
function pkResolve(expr,ms){
  if(!expr)return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(expr))return expr;
  const m=expr.match(/^milestone:(.+?)\s*(?:([+-])\s*(\d+)\s*([dwm]))?$/);
  if(!m)return null;
  const t=(ms||[]).find(x=>x.id===m[1]);
  if(!t)return null;
  if(!m[2])return t.date;
  const n=Number(m[3]),days=m[4]==='w'?n*7:m[4]==='m'?n*30:n;
  return pkAdd(t.date,(m[2]==='-'?-1:1)*days);
}
function pkPhase(date,cfg){
  const ms=cfg.milestones||[];
  for(const ph of cfg.phases||[]){
    if(ph.id==='default')continue;
    const s=ph.start?pkResolve(ph.start,ms):null,e=ph.end?pkResolve(ph.end,ms):null;
    if((ph.start&&!s)||(ph.end&&!e))continue;   // unresolvable bound = config error, not "always"
    if(s&&date<s)continue;
    if(e&&date>=e)continue;
    if(s||e)return ph;
  }
  return (cfg.phases||[]).find(x=>x.id==='default')||{id:'default',mode:'maintain'};
}
function pkHair(date,cfg,proto){
  if(!proto)return null;
  const ms=(cfg.milestones||[]).find(m=>m.id===(proto.milestone||'hair-transplant'));
  if(!ms)return null;
  const day=pkDiff(date,ms.date);
  const tl=(proto.timeline||[]).slice().sort((a,b)=>a.day-b.day);
  let cur=null,next=null;
  for(const t of tl){if(t.day<=day)cur=t;else if(!next)next=t;}
  const blackouts=(proto.blackouts||[]).filter(b=>{
    const f=pkResolve(b.from,cfg.milestones),t=pkResolve(b.to,cfg.milestones);
    return f&&t&&date>=f&&date<t;});
  const meds=(proto.medications||[]).filter(m=>{
    const s=pkResolve(m.start,cfg.milestones);
    if(s&&date<s)return false;
    if(m.cadence&&m.cadence.type==='weekly')return (m.cadence.days||[]).includes(pkDow(date));
    return true;});
  return {day,started:day>=0,date:ms.date,cur,next,blackouts,meds,timeline:tl,
          verifyPending:!(cfg.postop&&cfg.postop.entered_by_kevin)};
}
const pkBlack=(h,rule)=>h?(h.blackouts||[]).find(b=>b.rule===rule):null;

function pkAcwrPenalty(r){if(r===null||r===undefined)return 1;if(r<0.8)return .8;if(r<=1.3)return 1;if(r<=1.5)return .6;return .2;}
function pkRecovery({sleepHours,sleepQuality,soreness,energy,acwr}){
  const p={},cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  p.sleep=sleepHours!=null?cl(sleepHours/8,0,1)*35:null;
  p.quality=sleepQuality!=null?(sleepQuality/5)*20:null;
  if(soreness==null)p.soreness=null;
  else{const a=Array.isArray(soreness)?soreness.filter(x=>x&&x!=='none'):[];
       const sev=a.length===0?0:a.length>=3?1:a.length===2?.7:.4;
       p.soreness=(1-sev)*15;}
  p.energy=energy!=null?(energy/10)*15:null;
  p.load=pkAcwrPenalty(acwr)*15;
  // without something Kevin actually reported there is no score — the load term alone
  // would otherwise render 100 ("green light") off an empty check-in
  if(!['sleep','quality','soreness','energy'].some(k=>p[k]!=null))return null;
  const W={sleep:35,quality:20,soreness:15,energy:15,load:15};
  const got=Object.entries(p).filter(([,v])=>v!=null);
  const tot=got.reduce((a,[k])=>a+W[k],0);
  if(!tot)return null;
  return {score:Math.round((got.reduce((a,[,v])=>a+v,0)/tot)*100),confidence:'low',parts:p,
          missing:Object.entries(p).filter(([,v])=>v==null).map(([k])=>k)};
}
function pkVerdict(score,cfg,missing){
  const r=(cfg&&cfg.recovery)||{};
  if(score==null)return{band:'unknown',verdict:'Check in to get a read.',detail:'',volume:1,rpeCap:8};
  // never hand out a green light on inferred sleep. The score reweights around missing
  // inputs, which is honest, but "PR attempts allowed" is a real decision and it should
  // not rest on data Kevin never gave.
  const blindSleep=(missing||[]).includes('sleep');
  if(score>=(r.greenlight_at||80)&&!blindSleep)return{band:'green',verdict:'Green light.',detail:'Full volume. PR attempts allowed.',volume:1,rpeCap:9};
  if(score>=(r.greenlight_at||80)&&blindSleep)return{band:'ok',verdict:'Train. Full volume.',detail:'No sleep logged — holding off on PR attempts.',volume:1,rpeCap:8};
  if(score>=(r.reduce_volume_below||60))return{band:'ok',verdict:'Train. Full volume.',detail:'Normal progression.',volume:1,rpeCap:8};
  if(score>=(r.force_recovery_below||40))return{band:'light',verdict:'Train light.',detail:'Volume cut 30%, capped at RPE 7, no progression.',volume:.7,rpeCap:7};
  return{band:'recover',verdict:'Recover.',detail:'No lifting today.',volume:0,rpeCap:0};
}
/* Kevin hand-edits config.json, so accept what a human types. A silent NaN here poisons
   every calorie number downstream — he entered "5'7" and "05/21/2001" on 2026-08-04 and
   the engine (correctly) refused to produce a target at all. Working beats failing safe. */
function pkHeightIn(v){
  if(typeof v==='number'&&isFinite(v))return v;
  if(typeof v!=='string')return null;
  const ft=v.trim().match(/^(\d+)\s*(?:'|ft|feet)\s*(\d+(?:\.\d+)?)?\s*(?:"|in|inches)?$/i);
  if(ft)return +ft[1]*12+ +(ft[2]||0);
  const n=parseFloat(v);return isFinite(n)?n:null;
}
function pkBirth(v){
  if(typeof v!=='string')return null;
  const s=v.trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const us=s.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
  return us?`${us[3]}-${String(us[1]).padStart(2,'0')}-${String(us[2]).padStart(2,'0')}`:null;
}
function pkNutrition({date,cfg,weightLb,phase}){
  const pr=cfg.profile||{},t=cfg.targets||{},ph=phase||pkPhase(date,cfg);
  const height=pkHeightIn(pr.height_in),birth=pkBirth(pr.birth_date);
  const age=birth?Math.floor(pkDiff(date,birth)/365.25):null;
  const ov=cfg.nutrition&&cfg.nutrition.maintenance_override;
  let maint=ov||null;
  if(!maint&&weightLb&&height&&age!=null){
    const bmr=10*(weightLb*.4536)+6.25*(height*2.54)-5*age+(pr.sex==='female'?-161:5);
    const A={sedentary:1.35,light:1.45,moderate:1.55,high:1.7};
    maint=Math.round(bmr*((A[pr.activity_baseline]||1.55)+.05));
  }
  const locked=(ph.locks||[]).includes('no_deficit');
  /* the phase's own rate wins; fallbacks apply only when config omits one, so changing
     direction (cut ↔ build) is a config edit and never a code edit */
  let rate=ph.mode==='cut'?(ph.rate_lb_per_week||-.75):ph.mode==='lean-gain'?(ph.rate_lb_per_week||.35):0;
  if(locked&&rate<0)rate=0;
  const kcal=maint?Math.round(maint+(rate*3500)/7):null;
  const perLb=ph.protein_g_per_lb||t.protein_g_per_lb||1;
  const protein=weightLb?Math.round(weightLb*perLb):null;
  const fat=weightLb&&kcal?Math.round(Math.max(weightLb*(t.fat_g_per_lb_floor||.25),(.2*kcal)/9)):null;
  const carb=kcal&&protein!=null&&fat!=null?Math.round((kcal-protein*4-fat*9)/4):null;
  return {phase:ph.id,mode:ph.mode,locked,why:locked?(ph.why||null):null,maintenance:maint,kcal,
    band:kcal?[kcal-150,kcal+150]:null,protein,carb,fat,
    fiber:kcal?Math.round((kcal/1000)*(t.fiber_g_per_1000kcal||14)):null,
    water:weightLb?Math.round(weightLb*(t.water_oz_per_lb||.6)):null,
    source:ov?'calibrated':maint?'estimated':'needs-profile'};
}

/* ---- peak log parsing (mirrors peak-lib.parsePeakLog) ---- */
function pkParseLog(text){
  const days={};let cur=null,inSets=false;
  for(const raw of String(text||'').split('\n')){
    const line=raw.replace(/\r$/,'');
    const h=line.match(/^##\s+(\d{4}-\d{2}-\d{2})/);
    if(h){cur=days[h[1]]={date:h[1],checkin:null,metrics:{},session:null,sets:[],compliance:{},notes:[],food:[]};inSets=false;continue;}
    if(!cur)continue;
    if(/^sets:\s*$/.test(line)){inSets=true;continue;}
    if(inSets){
      const s=line.match(/^-\s+([\w-]+)\s*\|\s*(\d+)x([\d-]+)\s*@\s*([^|]+?)(?:\s*\|\s*rpe\s*(.+))?$/i);
      if(s){cur.sets.push({exercise:s[1],sets:+s[2],reps:s[3],load:s[4].trim(),rpe:(s[5]||'').trim()});continue;}
      if(!line.startsWith('-'))inSets=false;else continue;
    }
    const cb=line.match(/^- \[( |x)\]\s+(\d{4}-\d{2}-\d{2})\s+(.*)$/);
    if(cb){cur.compliance[pkCKey(cb[3])]={done:cb[1]==='x',label:cb[3].trim(),line};continue;}
    /* food ACCUMULATES — several meals a day, each its own line, template id or free text */
    const fd=line.match(/^food:\s*(.*)$/);
    if(fd){cur.food.push(fd[1].trim());continue;}
    const kv=line.match(/^(checkin|metrics|session|note):\s*(.*)$/);
    if(kv){
      if(kv[1]==='note'){cur.notes.push(kv[2].trim());continue;}
      const o={};
      for(const seg of kv[2].split('|')){const m=seg.trim().match(/^([\w-]+)\s*:\s*(.*)$/);if(m)o[m[1]]=m[2].trim();}
      if(kv[1]==='metrics')cur.metrics=o;else if(kv[1]==='checkin')cur.checkin=o;else cur.session=Object.assign(o,{raw:kv[2].trim()});
    }
  }
  return days;
}
function pkCKey(l){
  const s=l.toLowerCase();
  if(/^meds am/.test(s))return'meds_am';
  if(/^meds pm/.test(s))return'meds_pm';
  if(/protein/.test(s))return'protein';
  if(/calorie/.test(s))return'calories';
  if(/water/.test(s))return'water';
  if(/supplement/.test(s))return'supplements';
  if(/night routine|skincare/.test(s))return'night_routine';
  if(/stretch/.test(s))return'stretching';
  return s.replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,32);
}
function pkParseMetrics(text){
  const out=[];
  for(const raw of String(text||'').split('\n')){
    const m=raw.match(/^-\s*(\d{4}-\d{2}-\d{2})\s*\|\s*([\w-]+)\s*\|\s*(-?[\d.]+)\s*\|\s*([^|]*)\|\s*([^|]*)\|\s*(.*)$/);
    if(m)out.push({date:m[1],metric:m[2],value:+m[3],unit:m[4].trim(),source:m[5].trim(),confidence:m[6].trim()});
  }
  return out;
}
const pkSeries=(ms,name)=>ms.filter(m=>m.metric===name).sort((a,b)=>a.date.localeCompare(b.date));
const pkLatest=(ms,name)=>{const s=pkSeries(ms,name);return s.length?s[s.length-1]:null;};

/* ---- training load / ACWR ---- */
function pkLoad(day){
  if(!day||!day.session)return 0;
  if(day.sets&&day.sets.length){
    let t=0;
    for(const s of day.sets){const w=parseFloat(String(s.load).replace(/[^\d.]/g,''));const r=parseInt(String(s.reps).split('-')[0],10);
      if(!isNaN(w)&&!isNaN(r))t+=w*r*s.sets;}
    if(t)return t/1000;
  }
  const RL={easy:1,long:1.2,tempo:1.6,recovery:.7,intervals:1.8};
  if(day.session.dist)return parseFloat(day.session.dist)*(RL[day.session.type]||1)*3;
  const mins=parseFloat(String(day.session.dur||'').replace(/[^\d.]/g,''));
  if(!isNaN(mins))return /activity/.test(day.session.raw||'')?mins*.08:(mins*parseFloat(day.session.rpe_avg||6))/10;
  return 0;
}
function pkAcwr(days,today){
  let a=0,c=0;
  for(let i=0;i<7;i++)a+=pkLoad(days[pkAdd(today,-i)]);
  for(let i=0;i<28;i++)c+=pkLoad(days[pkAdd(today,-i)]);
  return c>0?a/(c/4):null;
}
/* ---- WHAT'S DUE, AND WHAT TOMORROW LOOKS LIKE ----
   Kevin's actual decision isn't "home or gym" — it's "am I going out, and if so am I
   lifting, running, or playing handball," and that partly depends on TOMORROW. So the
   check-in leads with the answer instead of asking him to hold it in his head:
   what the split says is next, whether it's a run day, and how loaded tomorrow is. */
function pkNextTemplate(){
  const rot=((PK.cfg||{}).schedule||{}).split||[];
  if(!rot.length)return null;
  const dates=Object.keys(PK.days).sort().reverse();
  for(const d of dates){
    const s=PK.days[d].session;
    if(!s||!/strength/.test(s.raw||''))continue;
    const tmpl=(s.raw||'').split('|').map(x=>x.trim()).find(x=>PK.tpl[x]);
    if(tmpl){const i=rot.indexOf(tmpl);return i>=0?rot[(i+1)%rot.length]:rot[0];}
  }
  return rot[0];
}
/* open, uncancelled calendar items on a date — same line grammar the Cal tab parses */
function pkDayLoad(date){
  return PK.cal.filter(l=>/^- \[ \]/.test(l)&&l.includes(date)).length;
}
function pkDue(t){
  const sch=(PK.cfg||{}).schedule||{};
  const tom=pkAdd(t,1);
  return {template:pkNextTemplate(),
          isRunDay:(sch.run_days||[]).includes(pkDow(t)),
          today:pkDayLoad(t),tomorrow:pkDayLoad(tom),tomDate:tom,
          didToday:!!(PK.days[t]&&PK.days[t].session)};
}
function pkSuggest(t){
  const d=pkDue(t),bits=[];
  if(d.template)bits.push('<b>'+esc(d.template)+'</b> is next in the split');
  if(d.isRunDay)bits.push('scheduled run day');
  /* the real scheduling insight: a loaded tomorrow means today is the day */
  if(d.tomorrow>=2)bits.push(`tomorrow has ${d.tomorrow} things on — if you're training hard this week, today is the day`);
  else if(d.today>=2&&d.tomorrow<=1)bits.push(`today is busy (${d.today}), tomorrow is clearer — a short home session now beats skipping`);
  else if(d.tomorrow===0&&d.today===0)bits.push('nothing on today or tomorrow — take the longer session');
  return bits.length?bits.join(' · '):null;
}

/* ---- WORKOUT ENGINE (app-only; ENGINES.md §1) ----
   Deterministic: same inputs, same session, every time. That reproducibility is what
   makes the strength trend mean anything. */
const PK_BUDGET={30:{sets:10,slots:3},45:{sets:15,slots:4},60:{sets:20,slots:6},90:{sets:28,slots:7}};
const PK_REGION_PATTERNS={
  chest:['horizontal_push'],back:['vertical_pull','horizontal_pull'],
  shoulders:['vertical_push','lateral_delt'],arms:['biceps','triceps'],
  legs:['squat','hinge','lunge','calf']};
function pkPainPatterns(region){
  const map={shoulder:['horizontal_push','vertical_push','lateral_delt','vertical_pull'],
    elbow:['biceps','triceps','vertical_pull','horizontal_pull'],
    back:['hinge','squat','horizontal_pull','carry'],
    knee:['squat','lunge','hinge'],hip:['squat','hinge','lunge'],
    ankle:['calf','lunge','squat'],wrist:['horizontal_push','triceps'],neck:['vertical_push']};
  return map[region]||[];
}
function pkHistory(days,exId){
  const dates=Object.keys(days).sort().reverse();
  for(const d of dates){
    const s=(days[d].sets||[]).filter(x=>x.exercise===exId);
    if(!s.length)continue;
    const load=parseFloat(String(s[0].load).replace(/[^\d.-]/g,''));
    /* the reps field holds EVERY set ("8-8-6"), not just the first — progression must see
       the set that fell short, or 8,8,6 reads as a clean top-of-range day and adds weight */
    const reps=String(s[0].reps).split('-').map(n=>parseInt(n,10)).filter(n=>!isNaN(n));
    const rpes=String(s[0].rpe||'').split(',').map(n=>parseFloat(n)).filter(n=>!isNaN(n));
    return {date:d,load:isNaN(load)?null:load,reps,sets:s[0].sets,
            maxRpe:rpes.length?Math.max(...rpes):null,raw:s[0]};
  }
  return null;
}
function pkGenerate(ci,ctx){
  const {days,cfg,ex,tpl,hair,rec}=ctx;
  const equip=new Set((cfg.equipment_profiles||{})[ci.loc]||[]);
  const verdict=pkVerdict(rec?rec.score:null,cfg,rec?rec.missing:null);
  const reasons=[];

  // ---- Step 0: gates, first trip wins ----
  const noTrain=pkBlack(hair,'no_training'),noLift=pkBlack(hair,'no_lifting');
  if(noTrain)return pkRecoverySession(ctx,ci,'Hair day '+hair.day+' — '+noTrain.reason,true);
  const pain=ci.pain&&ci.pain.region?ci.pain:null;
  let exclude=new Set();
  if(pain&&pain.severity==='real'){
    if(pain.region==='all')return pkRecoverySession(ctx,ci,'Pain flagged — nothing loaded today.',false);
    pkPainPatterns(pain.region).forEach(p=>exclude.add(p));
    reasons.push(pain.region+' pain — those patterns are out');
  }
  if(rec&&rec.score<((cfg.recovery||{}).force_recovery_below||40))
    return pkRecoverySession(ctx,ci,'Recovery '+rec.score+' — under '+((cfg.recovery||{}).force_recovery_below||40)+'.',false,true);

  // ---- Step 1: template ----
  const rot=(cfg.schedule||{}).split||['Upper A','Lower A','Upper B','Lower B'];
  const avail=rot.filter(n=>tpl[n]);
  let name=avail[0]||Object.keys(tpl).find(k=>!k.startsWith('_'));
  const dates=Object.keys(days).sort().reverse();
  let lastT=null,recentRegions=new Set();
  for(const d of dates){
    const s=days[d].session;
    if(!s||!/strength/.test(s.raw||''))continue;
    const t=(s.raw||'').split('|').map(x=>x.trim()).find(x=>tpl[x]);
    if(t&&!lastT)lastT=t;
    if(pkDiff(ci.date,d)<=2&&t&&tpl[t])(tpl[t].regions||[]).forEach(r=>recentRegions.add(r));
    if(lastT)break;
  }
  if(lastT&&avail.length>1){const i=avail.indexOf(lastT);name=avail[(i+1)%avail.length];}
  const sore=new Set((ci.sore||[]).filter(s=>s&&s!=='none'));
  const clashes=n=>(tpl[n].regions||[]).some(r=>sore.has(r));
  if(clashes(name)){const alt=avail.find(n=>!clashes(n));if(alt){reasons.push([...sore].join('/')+' still sore');name=alt;}}
  if(ci.min<=30&&(!lastT||pkDiff(ci.date,dates.find(d=>days[d].session)||ci.date)>=3)&&tpl['Full Body'])name='Full Body';
  if(noLift){
    reasons.push(noLift.reason);
    return pkRecoverySession(ctx,ci,'Hair day '+hair.day+' — '+noLift.reason,false,false,true);
  }
  /* manual swap: Kevin picked a different day. Honored after the safety gates above
     (recovery/blackout still win), logged as an override so Sunday names the pattern. */
  let forced=false;
  if(ci.forceTpl&&tpl[ci.forceTpl]&&ci.forceTpl!==name){
    reasons.push('your call — split said '+name);
    name=ci.forceTpl;forced=true;
  }
  const template=tpl[name];

  // ---- Step 2: volume budget ----
  const b=PK_BUDGET[ci.min]||PK_BUDGET[45];
  let budget=b.sets;
  if(rec&&rec.score<((cfg.recovery||{}).reduce_volume_below||60)){budget=Math.round(budget*.7);reasons.push('recovery '+rec.score);}
  if(ci.energy<=4){budget=Math.round(budget*.7);reasons.push('energy '+ci.energy);}
  if(pkPhase(ci.date,cfg).mode==='cut')budget=Math.round(budget*.9);
  budget=Math.max(budget,6);

  // ---- Steps 4+5: fill slots ----
  const cat=Object.entries(ex).filter(([k])=>!k.startsWith('_'));
  const used=new Set(),out=[];
  let spent=0;
  for(const slot of (template.slots||[])){
    if(spent>=budget||out.length>=b.slots)break;
    if(exclude.has(slot.pattern))continue;
    let pool=cat.filter(([id,e])=>e.pattern===slot.pattern&&!used.has(id)
      &&(e.equipment||[]).every(q=>equip.has(q))
      &&!(pain&&(e.contraindications||[]).includes(pain.region)));
    let note=null;
    if(!pool.length){
      // explicit equivalents before giving up — substitution is shown, never hidden
      const anyPat=cat.filter(([,e])=>e.pattern===slot.pattern);
      for(const [,e] of anyPat){
        const eq=ci.loc==='home'?e.home_equivalent:e.gym_equivalent;
        if(eq&&ex[eq]&&!used.has(eq)&&(ex[eq].equipment||[]).every(q=>equip.has(q))
           &&!(pain&&(ex[eq].contraindications||[]).includes(pain.region))){
          pool=[[eq,ex[eq]]];note='swapped in for '+e.name.toLowerCase()+' ('+ci.loc+' profile)';break;}
      }
    }
    if(!pool.length)continue;
    pool.sort((a,z)=>(a[1].priority||9)-(z[1].priority||9));
    const [id,e]=pool[0];
    used.add(id);
    const h=pkHistory(days,id);
    const rpe=Math.min(e.rpe||8,verdict.rpeCap||8);
    let sets=e.sets||3;
    if(spent+sets>budget)sets=Math.max(2,budget-spent);
    spent+=sets;
    const lo=(e.reps||[8,12])[0],hi=(e.reps||[8,12])[1];
    let load=null,reps=lo+'-'+hi,cue=null;
    if(!h){cue='calibration — find a weight, log what you do';}
    else if(h.load!=null){
      const topped=h.reps.length&&h.reps.every(r=>r>=hi)&&(h.maxRpe==null||h.maxRpe<=(e.rpe||8));
      if(topped&&verdict.rpeCap>=(e.rpe||8)){load=h.load+(e.increment_lb||5);cue='up '+(e.increment_lb||5)+' lb from '+h.load;}
      else if(h.reps.length&&h.reps.every(r=>r<lo)){load=Math.round((h.load*.9)/5)*5;cue='back off 10% — reps fell short twice';}
      else{load=h.load;cue='same load, chase the top of the range';}
    }
    out.push({id,name:e.name,sets,reps,rpe,rest:e.rest_s||90,load,loadType:e.load_type,
              note,cue,pattern:e.pattern,last:h});
  }
  const why=[];
  why.push(name+', '+ci.min+' min, '+ci.loc);
  if(reasons.length)why.push(reasons.join('; '));
  if(verdict.band==='green')why.push('green light — PR attempts allowed');
  else if(verdict.band==='light')why.push('holding loads, no progression');
  return {kind:'strength',template:name,minutes:ci.min,exercises:out,verdict,
          why:why.join(' · '),budget,spent,override:forced};
}
function pkRecoverySession(ctx,ci,reason,blackout,overridable,light){
  const {ex,cfg}=ctx;
  const equip=new Set((cfg.equipment_profiles||{})[ci.loc]||[]);
  const pick=pat=>Object.entries(ex).filter(([k,e])=>!k.startsWith('_')&&e.pattern===pat
      &&(e.equipment||[]).every(q=>equip.has(q))).sort((a,z)=>(a[1].priority||9)-(z[1].priority||9))[0];
  const items=[];
  const mob=pick('mobility'),con=pick('conditioning');
  if(con)items.push({id:con[0],name:con[1].name,sets:1,reps:light?'25-35 min':'20-30 min',rpe:3,rest:0,load:null,cue:'easy — nose-breathing pace'});
  if(mob)items.push({id:mob[0],name:mob[1].name,sets:1,reps:'8-10 min',rpe:2,rest:0,load:null,cue:null});
  return {kind:'recovery',template:'Recovery Day',minutes:ci.min,exercises:items,
          verdict:{band:blackout?'red':'light'},why:reason,blackout:!!blackout,overridable:!!overridable,light:!!light};
}

/* ---- writers ---- */
async function pkSave(path,text,message){
  let sha=null;
  try{const f=await getFile(path);if(f&&!f.stale)sha=f.sha;else if(f&&f.stale)throw new Error('offline — reconnect and try again');}catch(e){if(!/404/.test(e.message))throw e;}
  const res=await api(`contents/${path}`,{method:'PUT',body:JSON.stringify(
    Object.assign({message,content:enc(text)},sha?{sha}:{}))});
  try{localStorage.setItem('fc_'+path,JSON.stringify({text,sha:res.content.sha,ts:Date.now()}));}catch(e){}
  return true;
}
/* upsert a `key: value` line inside the day's `## DATE` section, creating the section
   (and the month file) when missing. Compliance checkboxes are appended dated. */
async function pkWriteDay(date,patch,compliance,message){
  const path=`data/peak/log/${pkMonth(date)}.md`;
  let f=null;try{f=await getFile(path);}catch(e){}
  if(f&&f.stale)throw new Error('offline — reconnect and try again');
  let lines=f?f.text.split('\n'):[`# Peak log — ${pkMonth(date)}`,''];
  let i=lines.findIndex(l=>l.startsWith('## '+date));
  if(i<0){
    const hs=pkPhase(date,PK.cfg),hh=pkHair(date,PK.cfg,PK.proto);
    const hdr=`## ${date} · ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(date+'T12:00:00Z').getUTCDay()]}`
      +(hh&&hh.started?` · hair D${hh.day}`:'')+` · ${hs.id}`;
    // keep day sections in date order
    let at=lines.length;
    for(let k=0;k<lines.length;k++){const m=lines[k].match(/^## (\d{4}-\d{2}-\d{2})/);if(m&&m[1]>date){at=k;break;}}
    lines.splice(at,0,hdr,'','');
    i=at;
  }
  let end=i+1;while(end<lines.length&&!/^## /.test(lines[end]))end++;
  const seg=lines.slice(i+1,end);
  for(const [k,v] of Object.entries(patch||{})){
    if(v==null)continue;
    // food and note accumulate (several meals a day); scalars are upserted in place
    if(k==='food'||k==='note'){
      const last=seg.map(l=>/^(checkin|metrics|session|food|note):/.test(l)).lastIndexOf(true);
      seg.splice(last+1,0,`${k}: ${v}`);
      continue;
    }
    const idx=seg.findIndex(l=>l.startsWith(k+':'));
    if(idx>=0)seg[idx]=`${k}: ${v}`;
    else{const last=seg.map(l=>/^(checkin|metrics|session|food):/.test(l)).lastIndexOf(true);seg.splice(last+1,0,`${k}: ${v}`);}
  }
  for(const label of (compliance||[])){
    if(seg.some(l=>l.includes(`] ${date} ${label}`)))continue;
    seg.push(`- [ ] ${date} ${label}`);
  }
  lines=lines.slice(0,i+1).concat(seg,lines.slice(end));
  await pkSave(path,lines.join('\n').replace(/\n{3,}/g,'\n\n'),message);
}
async function pkWriteMetrics(date,recs){
  if(!recs.length)return;
  const path=PKF.metrics;
  let f=null;try{f=await getFile(path);}catch(e){}
  const base=f?f.text.replace(/\s*$/,''):'# Metrics — normalized log\n\n## Log\n';
  const add=recs.map(r=>`- ${date} | ${r.metric} | ${r.value} | ${r.unit} | ${r.source||'manual'} | ${r.confidence||'low'}`);
  await pkSave(path,base+'\n'+add.join('\n')+'\n','peak metrics '+date);
}

async function pkLoadAll(t){
  const [cfg,proto,ex,tpl,run,mtx,hair,m0,m1,meals,cal]=await Promise.all([
    getFile(PKF.cfg),getFile(PKF.proto),getFile(PKF.ex),getFile(PKF.tpl),getFile(PKF.run),
    getFile(PKF.metrics),getFile(PKF.hair),
    getFile(`data/peak/log/${pkMonth(t)}.md`),getFile(`data/peak/log/${pkMonth(pkAdd(t,-31))}.md`),
    getFile(PKF.meals),
    /* the calendar answers "am I out tomorrow?" — which is half of how Kevin actually
       decides whether today is the lifting day */
    getFile('data/calendar.md')]);
  const J=f=>{if(!f)return null;try{return JSON.parse(f.text);}catch(e){return null;}};
  PK.cfg=J(cfg);PK.proto=J(proto);PK.ex=J(ex)||{};PK.tpl=J(tpl)||{};PK.run=J(run);PK.meals=J(meals)||{};
  PK.cal=(cal?cal.text:'').replace(/\r/g,'').split('\n');
  /* Strip \r on load. JS's '.' does NOT match \r, so a trailing CR makes every
     `(.*)$` parser silently return zero matches on CRLF files — and this repo is
     edited on Windows, so files genuinely arrive with CRLF. */
  const nl=f=>(f?f.text:'').replace(/\r/g,'');
  PK.metrics=pkParseMetrics(nl(mtx));
  PK.hairLines=nl(hair).split('\n');
  PK.days=Object.assign({},pkParseLog(nl(m1)),pkParseLog(nl(m0)));
  PK.loaded=!!PK.cfg;
  return PK.loaded;
}

  return `<svg class="pk-spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="none"><polyline points="${pts}" stroke="var(--muted)" stroke-width="1.2" stroke-linejoin="round"/></svg>`;

  if(hair&&hair.started){

  {

/* check-in: pick the MODALITY first (home / gym / run / something else), then only the
   questions that modality needs. Defaults carry from the last check-in, so the common
   case is still a couple of taps. */
const PK_ACTIVITIES=['handball','basketball','hiking','swimming','snowboarding','other'];
let pkCI={};
function pkOpenCheckin(t,isOverride){
  const prev=(()=>{for(let i=1;i<=7;i++){const d=PK.days[pkAdd(t,-i)];if(d&&d.checkin)return d.checkin;}return{};})();
  const due=pkDue(t);

        min:+(prev.min||45),energy:+(prev.energy||6),sore:[],pain:null,

  $('pk-primary').textContent='Generate workout';

      <button class="pk-dbtn" data-d="-1">‹ earlier</button><span id="pk-dlabel"></span><button class="pk-dbtn" data-d="1">later ›</button></span></div>
    <div class="pk-q">What are you doing</div>
    ${opts('mode',['home','gym','run','other','rest'],pkCI.mode,v=>({home:'Home',gym:'Gym',run:'Run',other:'Other',rest:'Rest'}[v]))}
    <div id="pk-restwrap" hidden><div class="pk-sugg">A rest day is <b>data, not a miss</b> — it's logged, and the weekly score leaves it out entirely rather than counting it either way. Skipping the check-in instead just leaves a hole.</div></div>
    <div id="pk-lift">
      <div class="pk-q">Time</div>${opts('min',[30,45,60,90],pkCI.min)}
      <div class="pk-q">Sore</div>${opts('sore',['none','chest','back','shoulders','arms','legs'],'none')}
    </div>
    <div id="pk-act" hidden>
      <div class="pk-q">What</div>${opts('act',PK_ACTIVITIES,pkCI.activity,v=>v[0].toUpperCase()+v.slice(1))}
      <div class="pk-q">How long</div>${opts('actmin',[30,60,90,120],pkCI.actMin)}
    </div>
    <div id="pk-runnote" hidden><div class="pk-sugg" id="pk-runplan"></div></div>
    <div class="pk-q">Energy <span class="pk-sliderval" id="pk-ev">${pkCI.energy}</span></div>
    <input class="pk-slider" id="pk-energy" type="range" min="1" max="10" value="${pkCI.energy}">
    <div class="pk-q">Pain or injury</div>${opts('pain',['no','yes'],'no')}
    <div id="pk-painwrap" hidden>${opts('painreg',['shoulder','elbow','back','knee','hip','ankle'],'')}
      <div class="pk-q">How bad</div>${opts('painsev',['niggle','real'],'niggle')}</div>`;
  const applyMode=()=>{
    const m=pkCI.mode,d=pkCI.date;
    $('pk-lift').hidden=!(m==='home'||m==='gym');
    $('pk-act').hidden=m!=='other';
    $('pk-runnote').hidden=m!=='run';
    $('pk-restwrap').hidden=m!=='rest';
    if(m==='run'){
      const r=pkTodayRun(d);
      $('pk-runplan').innerHTML=r?`Plan says <b>${esc(r.type)} ${r.miles} mi</b>.`
        :'No run prescribed — log whatever you run and the weekly total picks it up.';
    }
    $('pk-primary').textContent=m==='other'?'Log activity':m==='run'?'Log run':m==='rest'?'Log rest day':'Generate workout';
    if(m==='home'||m==='gym')pkCI.loc=m;
    const back=pkDiff(todayStr(),d);
    $('pk-dlabel').textContent=back===0?' today ':back===1?' yesterday ':` ${d} `;
    $('pk-dnav').querySelector('[data-d="1"]').style.visibility=back===0?'hidden':'';
    const ex=PK.days[d];
    if(ex&&ex.session)$('pk-restwrap').hidden=false,$('pk-restwrap').innerHTML=

    else if(m!=='rest')$('pk-restwrap').hidden=true;

     2026-08-03 had to be written by hand), and a workout that happened should be loggable */
  $('pk-dnav').onclick=e=>{

      else if(name==='painreg')pkCI.pain=Object.assign(pkCI.pain||{severity:'niggle'},{region:v});
      else if(name==='painsev')pkCI.pain=Object.assign(pkCI.pain||{},{severity:v});
    };
  });
  $('pk-energy').oninput=e=>{pkCI.energy=+e.target.value;$('pk-ev').textContent=e.target.value;};
  applyMode();
  $('pk-primary').onclick=pkSubmitCheckin;
  $('pk-ov').hidden=false;
}
/* today's prescribed run, if the running plan has one for this weekday */
function pkTodayRun(t){
  if(!PK.run||!PK.cfg)return null;
  const race=(PK.cfg.milestones||[]).find(m=>m.type==='race');
  if(!race)return null;
  const blk=(PK.run.blocks||{})[race.plan]||(PK.run.blocks||{})['half-16wk'];
  if(!blk)return null;
  const runDays=((PK.cfg.schedule||{}).run_days)||[];
  const i=runDays.indexOf(pkDow(t));
  if(i<0)return null;
  const start=pkAdd(race.date,-(blk.weeks||16)*7);
  // before the block opens we're building base, not executing a prescription
  if(t<start){
    const base=Math.max(2,Math.round((blk.entry_requirement_mi_per_week||12)/Math.max(1,runDays.length)));
    return {type:i===runDays.length-1?'long':'easy',miles:i===runDays.length-1?base+1:base,base:true};
  }
  let mi=0;for(let k=0;k<7;k++){const d=PK.days[pkAdd(pkMonday(t),k)];if(d&&d.session&&d.session.dist)mi+=parseFloat(d.session.dist)||0;}
  const target=Math.min(blk.peak_week_mi||28,Math.max(blk.entry_requirement_mi_per_week||12,mi*1.1));
  const long=Math.min(Math.round(target*0.38),blk.peak_long_run_mi||11);
  const others=runDays.slice(0,-1);
  return i===runDays.length-1?{type:'long',miles:long}
    :{type:(blk.structure||['easy'])[i]||'easy',miles:Math.round(((target-long)/Math.max(1,others.length))*10)/10};
}
async function pkSubmitCheckin(){
  const b=$('pk-primary');b.disabled=true;b.textContent='Saving…';
  const t=pkCI.date,m=pkCI.mode;
  const sore=pkCI.sore.length?pkCI.sore.join('+'):'none';
  const line=`loc:${m==='run'||m==='other'?m:pkCI.loc} | min:${m==='other'?pkCI.actMin:pkCI.min} | energy:${pkCI.energy} | sore:${sore} | pain:${pkCI.pain?pkCI.pain.region:'none'}`
    +(pkCI.pain?` | pain_sev:${pkCI.pain.severity}`:'')+(pkCI.override?' | override:yes':'');
  try{
    const patch={checkin:line};
    /* run and activity are logged as they happen — there is nothing to generate, and a
       session Kevin actually did should never be sitting behind a "generate" button */
    if(m==='other')patch.session=`activity | ${pkCI.activity} | dur:${pkCI.actMin}m | src:manual`;
    else if(m==='rest')patch.session='rest | src:manual';
    else if(m==='run'){
      const r=pkTodayRun(t);
      patch.session=`run | type:${r?r.type:'easy'} | dur:${pkCI.min}m | src:manual`;
    }
    await pkWriteDay(t,patch,pkComplianceLabels(t),'peak check-in '+t);
    $('pk-ov').hidden=true;
    PK.workout=null;
    await runRender('peak');
    if(m==='run')pkOpenRunLog(t);
  }catch(e){alert('Check-in failed: '+e.message);}
  b.disabled=false;b.textContent='Generate workout';
}

/* ---- BRIEF: industry intel + markets/world ----
   Split out of Today (which is about what Kevin DOES today) per his 2026-08-03 note.
   Both sections are written by the intel routine into the daily note as '## Intel' and
   '## Markets'. If today's briefing hasn't landed yet, walk back up to 5 days and SAY
   which day is being shown — a stale brief presented as today's is a lie. */
async function renderBrief(){
  const body=$('brief-body');if(!keepView)body.innerHTML=skel();
  let found=null;
  for(let i=0;i<5;i++){
    const d=plusDays(-i);
    const f=await getFile(`daily/${d}.md`)||await getFile(`daily/${d}-intel.md`);
    if(!f)continue;
    const secs=noteSections(f.text).secs;
    const intel=secByName(secs,/^intel\b/i),markets=secByName(secs,/^markets?\b/i);
    if(intel||markets){found={date:d,ageDays:i,intel,markets};break;}
  }
  body.innerHTML='';
  $('brief-date').textContent=found
    ? (found.ageDays===0?'today':new Date(found.date+'T12:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}))
    : '';
  if(!found){
    const c=card();body.appendChild(c);
    empty(c,'No briefing in the last 5 days. The intel routine runs ~7am ET daily — if this stays empty, the routine is failing silently and that is worth checking.');
    return;
  }
  if(found.ageDays>0)body.insertAdjacentHTML('beforeend',
    `<div class="stale">⚠ No briefing today — showing ${found.ageDays} day${found.ageDays>1?'s':''} ago</div>`);

  const section=(title,sec,emptyMsg)=>{
    body.insertAdjacentHTML('beforeend',`<div class="sec">${esc(title)}</div>`);
    const c=card();body.appendChild(c);
    if(!sec||!sec.lines.some(l=>l.trim())){empty(c,emptyMsg);return;}
    const stories=parseIntel(sec.lines);
    if(stories.length){stories.forEach(st=>c.appendChild(intelEl(st)));return;}
    // the routine's honest "nothing new today" line isn't a story — render it as prose
    const wrap=document.createElement('div');wrap.className='note';
    sec.lines.forEach(l=>{if(l.trim()){const e=document.createElement('div');e.innerHTML=inline(l);wrap.appendChild(e);}});
    c.appendChild(wrap);
  };
  section('Industry',found.intel,'No industry section in this briefing.');
  section('Markets & World',found.markets,'No markets section yet — the routine adds one from 2026-08-03 onward.');
}

/* ---- LEARN / EDUCATION: TOC + collapsible sections, tappable progress ---- */
const eduMd=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[(.+?)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--accent)">$1</a>');
function eduLine(wrap,line){
  const cb=line.match(/^\s*- \[( |x)\] (.*)$/);
  if(cb){
    const it={checked:cb[1]==='x',body:cb[2]};
    const div=document.createElement('div');div.className='item'+(it.checked?' done':'');div.style.padding='10px 2px';
    div.innerHTML=`<div class="hit"><div class="box">✓</div></div><div class="txt">${eduMd(it.body)}</div>`;
    if(!it.checked)div.querySelector('.hit').onclick=()=>toggleLine('learning/insulation.md',line,div); // marks done in place, keeps folds
    wrap.appendChild(div);return;
  }
  const el=document.createElement('div');
  if(line.startsWith('### ')){el.className='h1';el.style.fontSize='15px';el.textContent=line.slice(4);}
  else if(line.match(/^\s*- /)){el.className='bullet';el.innerHTML='• '+eduMd(line.replace(/^\s*- /,''));}
  else if(line.trim()){el.innerHTML=eduMd(line);}
  else{el.className='gap';}
  wrap.appendChild(el);
}
async function renderEdu(){
  const body=$('edu-body');if(!keepView)body.innerHTML=skel();
  const f=await getFile('learning/insulation.md');body.innerHTML='';
  if(!f){const c=card();body.appendChild(c);empty(c,'No curriculum found (learning/insulation.md).');return;}
  const lines=f.text.split('\n').map(l=>l.replace(/\r$/,''));
  const total=lines.filter(l=>/^\s*- \[( |x)\] /.test(l)).length;
  const done=lines.filter(l=>/^\s*- \[x\] /.test(l)).length;
  if(total){
    const chips=document.createElement('div');chips.className='chips';
    chips.innerHTML=`<div class="chip">Progress <b>${done}/${total}</b></div><div class="chip">${Math.round(done/total*100)}% done</div>`;
    body.appendChild(chips);
  }
  // split into preamble + ## sections
  const secs=[];let pre=[],cur=null;
  for(const line of lines){
    if(line.startsWith('## ')){cur={title:line.slice(3),lines:[]};secs.push(cur);continue;}
    if(line.startsWith('# '))continue;
    (cur?cur.lines:pre).push(line);
  }
  if(pre.some(l=>l.trim())){const pc=card();const w=document.createElement('div');w.className='note';pre.forEach(l=>eduLine(w,l));pc.appendChild(w);body.appendChild(pc);}
  const folds=[];
  // table of contents
  if(secs.length>1){
    body.insertAdjacentHTML('beforeend','<div class="sec">Contents</div>');
    const toc=card();
    secs.forEach((s,i)=>{
      const todo=s.lines.filter(l=>/^\s*- \[ \] /.test(l)).length;
      const b=document.createElement('button');b.className='more';
      b.innerHTML=`${esc(s.title)}${todo?` <span style="color:var(--muted)">· ${todo} to do</span>`:''}`;
      b.onclick=()=>{const fd=folds[i];if(fd.card.style.display==='none')fd.head.click();fd.head.scrollIntoView({behavior:'smooth',block:'start'});};
      toc.appendChild(b);
    });
    body.appendChild(toc);
  }
  // collapsible section folds (first open)
  secs.forEach((s,i)=>{
    const todo=s.lines.filter(l=>/^\s*- \[ \] /.test(l)).length;
    const dn=s.lines.filter(l=>/^\s*- \[x\] /.test(l)).length;
    const label=(todo+dn)?`${dn}/${todo+dn} done`:'';
    const fd=fold(s.title,label,i===0,0);
    const w=document.createElement('div');w.className='note';
    s.lines.forEach(l=>eduLine(w,l));
    fd.card.appendChild(w);
    body.appendChild(fd.head);body.appendChild(fd.card);
    folds.push(fd);
  });
}

  const di=it.body.indexOf(' — ');
  if(di>0){const x=it.body.slice(di+3).split(' | ')[0].trim();if(x)o.detail=x.slice(0,240);}
  for(const k of ['pri','due','nudge','waiting-on','stuck','outcome','done'])
    {const v=meta(it.body,k);if(v)o[k.replace('-','_')]=v;}
  Object.keys(o).forEach(k=>{if(o[k]===undefined)delete o[k];});
  return o;
}
/* replace a `key:` token's value in place (handles both ' | key:v' segments and
   values embedded after the em dash), or append a new ' | key:v' segment */
function setTok(line,key,val){
  const re=new RegExp('('+key+':)\\s*([^|]*?)(\\s*)(\\||$)');
  if(new RegExp(key+':').test(line))
    return line.replace(re,(m,k,v,sp,tail)=>k+val+(tail?' '+tail:'')).replace(/\s+$/,'');
  return line.replace(/\s+$/,'')+` | ${key}:${val}`;
}
const aiOpenGuard=cur=>/^- \[ \] /.test(cur)?null:
  {error:'only open "- [ ]" items can be edited — checked items are closed forever, cancelled lines stay untouched'};

/* single-line rewrite with every guard: whitelist, sha concurrency, exact-line match */
async function aiRewriteLine(path,line,fn,msg){
  if(!AI_WRITE_FILES.includes(path))return{error:'file not writable by the assistant'};
  let f;try{f=await getFile(path);}catch(e){return{error:'could not read '+path};}
  if(!f)return{error:'file not found'};
  if(f.stale)return{error:'offline — cannot write safely'};
  const lines=f.text.split('\n');
  const i=lines.findIndex(l=>norm(l)===norm(line||''));
  if(i<0)return{error:'item not found — it changed since it was read; re-read before writing'};
  const out=fn(lines[i]);
  if(out&&out.error)return out;
  lines[i]=out;
  try{
    const res=await api(`contents/${path}`,{method:'PUT',body:JSON.stringify({message:msg,sha:f.sha,content:enc(lines.join('\n'))})});
    try{localStorage.setItem('fc_'+path,JSON.stringify({text:lines.join('\n'),sha:res.content.sha,ts:Date.now()}));}catch(e){}
  }catch(e){return{error:'write failed: '+e.message};}
  return{ok:true,file:path,line:out};
}
/* insert a new checkbox line at the end of a ## section (fuzzy match; created if new) */
async function aiInsertUnder(path,section,line,msg){
  if(!AI_WRITE_FILES.includes(path))return{error:'file not writable by the assistant'};
  let f;try{f=await getFile(path);}catch(e){return{error:'could not read '+path};}
  if(!f)return{error:'file not found'};
  if(f.stale)return{error:'offline — cannot write safely'};
  const lines=f.text.split('\n'),sl=section.toLowerCase();
  let s=lines.findIndex(l=>l.startsWith('## ')&&l.slice(3).trim().toLowerCase()===sl);
  if(s<0)s=lines.findIndex(l=>l.startsWith('## ')&&(l.slice(3).trim().toLowerCase().includes(sl)||(sl&&sl.includes(l.slice(3).trim().toLowerCase()))));
  let finalSection=section;
  if(s<0){
    while(lines.length&&!lines[lines.length-1].trim())lines.pop();
    lines.push('',`## ${section}`,line);
  }else{
    finalSection=lines[s].slice(3).trim();
    let end=lines.length;
    for(let j=s+1;j<lines.length;j++)if(lines[j].startsWith('## ')){end=j;break;}
    let ins=end;
    while(ins>s+1&&!lines[ins-1].trim())ins--;
    lines.splice(ins,0,line);
  }
  try{
    const res=await api(`contents/${path}`,{method:'PUT',body:JSON.stringify({message:msg,sha:f.sha,content:enc(lines.join('\n'))})});
    try{localStorage.setItem('fc_'+path,JSON.stringify({text:lines.join('\n'),sha:res.content.sha,ts:Date.now()}));}catch(e){}
  }catch(e){return{error:'write failed: '+e.message};}
  return{ok:true,file:path,line,section:finalSection};
}
/* completing an item closes its plan/task/loop twins too (same matcher Today uses) */
async function aiCascade(srcFile,srcLine){
  const t=todayStr(),done=[];
  const title=stripMeta(String(srcLine).replace(/^- \[[ x]\] /,''));
  for(const p of ['data/tasks.md','data/loops.md',`daily/${t}.md`]){
    if(p===srcFile)continue;
    let f;try{f=await getFile(p);}catch(e){continue;}
    if(!f||f.stale)continue;
    for(const it of parseChecklist(f.text).filter(i=>!i.checked)){
      if(sameThing(title,it.body)){
        const ok=await toggleLine(p,it.line,null,true,`ai: done (cascade) — ${title.slice(0,44)}`);
        if(ok)done.push(p);
      }
    }
  }
  return done;
}

const AI_SCOPES={daily:[/^daily\//],weekly:[/^weekly\//],ideas:[/^data\/ideas\.md$/],problems:[/^data\/problems\.md$/],
  people:[/^data\/people\.md$/],decisions:[/^docs\/strategy\/STRATEGY_DECISIONS\.md$/]};
async function aiSearchMemory(a={}){
  const q=String(a.query||'').trim();
  if(q.length<2)return{error:'query too short'};
  const scopes=AI_SCOPES[a.scope]||null;
  let tr;try{tr=await api('git/trees/main?recursive=1');}catch(e){return{error:'could not list repo files'};}
  if(!tr||!tr.tree)return{error:'could not list repo files'};
  let paths=tr.tree.filter(n=>n.type==='blob'&&/\.md$/i.test(n.path)&&aiReadable(n.path)&&(!scopes||scopes.some(re=>re.test(n.path))));
  paths.sort((x,y)=>y.path.localeCompare(x.path)); // newest daily/weekly first
  const dailyP=paths.filter(n=>/^daily\//.test(n.path)).slice(0,60);
  paths=paths.filter(n=>!/^daily\//.test(n.path)).slice(0,40).concat(dailyP).slice(0,90);
  const ql=q.toLowerCase(),hits=[];
  for(let i=0;i<paths.length&&hits.length<30;i+=10){
    const chunk=paths.slice(i,i+10);
    const texts=await Promise.all(chunk.map(async n=>{
      const c=cacheGet(n.path);
      if(c&&c.sha===n.sha)return c.text;
      try{
        const b=await api(`git/blobs/${n.sha}`);
        const text=dec(b.content.replace(/\n/g,''));
        try{localStorage.setItem('fc_'+n.path,JSON.stringify({text,sha:n.sha,ts:Date.now()}));}catch(e){}
        return text;
      }catch(e){return'';}
    }));
    chunk.forEach((n,j)=>{
      let per=0;
      for(const [k,l] of texts[j].split('\n').entries()){
        if(per>=4||hits.length>=30)break;
        if(l.toLowerCase().includes(ql)){hits.push({path:n.path,line_no:k+1,text:l.replace(/\r$/,'').trim().slice(0,300)});per++;}
      }
    });
  }
  return{query:q,files_searched:paths.length,hits};
}

/* ---- deterministic planner (the model presents; this ranks) ---- */
async function recommendTasks(a={}){
  const t=todayStr();
  const [tasks,loops,daily,cal]=await Promise.all([
    getFile('data/tasks.md'),getFile('data/loops.md'),getFile(`daily/${t}.md`),getFile('data/calendar.md')]);
  const d0=new Date(),nowMin=d0.getHours()*60+d0.getMinutes();
  let nextEv=null;
  if(cal)for(const it of parseChecklist(cal.text)){
    if(it.checked)continue;
    const m=it.body.match(/^(\d{4}-\d{2}-\d{2}) (\d{2}):(\d{2})/);
    if(m&&m[1]===t){const em=+m[2]*60+ +m[3];if(em>nowMin&&(nextEv===null||em<nextEv))nextEv=em;}
  }
  const windowMin=Math.max(0,(nextEv===null?21*60:nextEv)-nowMin);
  const free=Math.round((a.available_minutes>0?Math.min(a.available_minutes,windowMin||a.available_minutes):windowMin)*0.8);
  const cand=[],blocked=[],waiting=[];
  const push=(it,file,rank,reason)=>cand.push(Object.assign(aiItem(it,file),{rank,reason}));
  if(daily){
    const s=secByName(noteSections(daily.text).secs,/^top 3/i);
    if(s)checkboxLines(s.lines).filter(i=>!i.checked).forEach(i=>push(i,`daily/${t}.md`,0,"open Top 3 item — today's committed plan"));
  }
  if(tasks)for(const i of parseChecklist(tasks.text).filter(x=>!x.checked)){
    const st=meta(i.body,'stuck');
    if(st){blocked.push(Object.assign(aiItem(i,'data/tasks.md'),{blocked_by:st}));continue;}
    const due=meta(i.body,'due'),pri=meta(i.body,'pri');
    if(due&&aiDate(due)&&due<t)push(i,'data/tasks.md',1,`overdue since ${due}`);
    else if(due===t)push(i,'data/tasks.md',2,'due today');
    else if(pri==='1')push(i,'data/tasks.md',3,'priority 1');
  }
  if(loops)for(const i of parseChecklist(loops.text).filter(x=>!x.checked)){
    const st=meta(i.body,'stuck');
    if(st){blocked.push(Object.assign(aiItem(i,'data/loops.md'),{blocked_by:st}));continue;}
    const w=meta(i.body,'waiting-on'),n=meta(i.body,'nudge');
    if(n&&n<=t){
      if(w)waiting.push(Object.assign(aiItem(i,'data/loops.md'),{reason:`waiting on ${w} — nudge due; chase or bump the date`}));
      else push(i,'data/loops.md',4,n<t?`follow-up overdue (nudge ${n})`:'follow-up due today');
    }
  }
  cand.sort((x,y)=>x.rank-y.rank);
  const seen=[],uniq=[];
  for(const c of cand){if(seen.some(s=>sameThing(s,c.title)))continue;seen.push(c.title);uniq.push(c);}
  return{now:aiNow(),free_minutes:free,buffer_note:'free_minutes already includes a 20% buffer',
    candidates:uniq.slice(0,3),also_ranked:uniq.slice(3,6),blocked:blocked.slice(0,5),waiting:waiting.slice(0,5),
    rule:'Deterministic ranking. Present at most 3, default first. You may reorder WITHIN this set only for an explicit contextual reason, stated in one line. Never add tasks outside this set unless Kevin asked for brainstorming.'};
}

/* ---- cost ledger (data/ai-usage.md, append-only; authoritative usage fields from the API) ---- */
function aiAggregates(text){
  const t=todayStr(),m=t.slice(0,7);let day=0,mon=0;
  for(const l of String(text||'').split('\n')){
    const mm=l.match(/^- (\d{4}-\d{2}-\d{2})T.*\| cost:\$([\d.]+)/);
    if(!mm)continue;
    if(mm[1]===t)day+=+mm[2];
    if(mm[1].slice(0,7)===m)mon+=+mm[2];
  }
  return{day,mon};
}
async function aiLogUsage(line){
  const path='data/ai-usage.md';
  let pend;try{pend=JSON.parse(localStorage.getItem('ai_usage_pend')||'[]');}catch(e){pend=[];}
  pend.push(line);
  try{
    const f=await getFile(path);
    if(!f||f.stale)throw new Error('ledger unavailable');
    const text=f.text.replace(/\s*$/,'\n')+pend.join('\n')+'\n';
    const res=await api(`contents/${path}`,{method:'PUT',body:JSON.stringify({message:`ai: usage log (+${pend.length})`,sha:f.sha,content:enc(text)})});
    try{localStorage.setItem('ai_usage_pend','[]');localStorage.setItem('fc_'+path,JSON.stringify({text,sha:res.content.sha,ts:Date.now()}));}catch(e){}
    return text;
  }catch(e){try{localStorage.setItem('ai_usage_pend',JSON.stringify(pend));}catch(_){}return null;}
}

/* ---- orchestrator ---- */
async function oai(body){
  const url=aiProxyUrl();
  if(!url)throw new Error('AI proxy not configured — deploy ops/ai-proxy (see DEPLOY.md), then paste its URL here');
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),90000);
  try{
    const r=await fetch(url,{method:'POST',signal:ctl.signal,
      headers:{'Authorization':'Bearer '+aiToken(),'Content-Type':'application/json'},
      body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error((j.error&&(j.error.message||j.error))||('proxy error '+r.status));
    return j;
  }finally{clearTimeout(to);}
}
/* conversation continuity: iOS kills backgrounded pages, so the chain pointer and
   the rendered transcript live in localStorage with an idle TTL — a conversation
   survives app switching, expires after an hour of silence, and "New" clears it.
   (OpenAI holds the actual chained context server-side via store:true; this keeps
   only the response-id pointer plus what was on screen.) */
const AI_CONV_TTL=60*60*1000;
let aiLog=[];
function aiConvLoad(){
  try{const c=JSON.parse(localStorage.getItem('ai_conv')||'null');
    if(c&&Date.now()-(c.ts||0)<AI_CONV_TTL)return c;}catch(e){}
  return null;
}
function aiConvSave(prev){
  const cur=aiConvLoad()||{};
  try{localStorage.setItem('ai_conv',JSON.stringify({prev:prev===undefined?(cur.prev||''):prev,ts:Date.now(),log:aiLog.slice(-60)}));}catch(e){}
}
function aiConvClear(){aiLog=[];try{localStorage.removeItem('ai_conv');sessionStorage.removeItem('ai_prev');}catch(e){}}
const aiOutputText=resp=>(resp.output||[]).filter(o=>o.type==='message')
  .flatMap(m=>m.content||[]).filter(c=>c.type==='output_text').map(c=>c.text).join('\n').trim();
const AI_BUSY={get_today:'reading today',get_tasks:'reading tasks',get_loops:'reading loops',get_calendar:'reading calendar',
  get_week:'reading the week',search_memory:'searching memory',read_note:'reading a note',get_recent_activity:'reading activity',
  plan_remaining_day:'ranking the day',propose_changes:'preparing changes'};
async function aiRunTool(name,argstr,budget){
  const tool=AI_TOOLS[name];
  if(!tool)return{error:'unknown tool '+name};
  let args={};
  if(argstr){try{args=JSON.parse(argstr);}catch(e){return{error:'arguments were not valid JSON'};}}
  if(tool.write&&name!=='propose_changes'&&budget.writes>=3)
    return{error:'write budget (3 direct writes per turn) reached — put the remaining changes in ONE propose_changes call for Kevin to confirm'};
  let out;
  try{out=await tool.run(args);}catch(e){out={error:String((e&&e.message)||e)};}
  if(tool.write&&name!=='propose_changes'){
    if(out&&out.ok){
      budget.writes++;
      aiChip('',tool.chip||name.toUpperCase(),out.summary||'done');
      if(typeof updateBadge==='function')updateBadge();
      if(typeof renderers!=='undefined'&&renderers[currentView])runRender(currentView);
    }else aiChip('err',(tool.chip||name.toUpperCase())+' — FAILED',(out&&out.error)||'unknown error');
  }
  return out;
}
async function aiTurn(text,busyEl){
  const t0=Date.now();
  let prev=(aiConvLoad()||{}).prev||'';
  let input=[{role:'user',content:`[now: ${aiNow()}]\n${text}`}];
  const use={model:'',resp:'',in:0,cached:0,out:0,reason:0,total:0,cost:0,calls:0};
  const budget={writes:0};
  let tools=0,final='';
  for(let iter=0;iter<8;iter++){
    if(busyEl)busyEl.textContent=iter?'thinking…':'thinking…';
    const body={input,instructions:AI_SYSTEM,tools:AI_SCHEMAS,store:true,max_output_tokens:2000};
    if(prev)body.previous_response_id=prev;
    const resp=await oai(body);
    prev=resp.id||prev;use.resp=resp.id||use.resp;use.model=resp.model||use.model;
    const u=resp.usage||{},cin=(u.input_tokens_details||{}).cached_tokens||0;
    use.in+=u.input_tokens||0;use.cached+=cin;use.out+=u.output_tokens||0;
    use.reason+=(u.output_tokens_details||{}).reasoning_tokens||0;
    use.total+=u.total_tokens||0;use.calls++;
    use.cost+=aiCost(resp.model,u.input_tokens||0,cin,u.output_tokens||0);
    const calls=(resp.output||[]).filter(o=>o.type==='function_call');
    if(!calls.length){final=aiOutputText(resp);break;}
    input=[];
    for(const c of calls){
      tools++;
      if(busyEl)busyEl.textContent=(AI_BUSY[c.name]||('running '+c.name))+'…';
      const out=await aiRunTool(c.name,c.arguments,budget);
      input.push({type:'function_call_output',call_id:c.call_id,output:JSON.stringify(out).slice(0,32000)});
    }
    if(iter===7)final='Stopped — tool-call limit for one turn reached. Ask again to continue.';
  }
  aiConvSave(prev);
  if(final)aiText(final);
  else if(budget.writes)aiText('Done.');
  else aiText("(no answer came back — try rephrasing)");
  const ms=Date.now()-t0;
  aiMsg('ai-cost',`$${use.cost.toFixed(3)} · ${tools} tool${tools===1?'':'s'}${budget.writes?` · ${budget.writes} write${budget.writes===1?'':'s'}`:''} · ${(ms/1000).toFixed(1)}s`);
  const line=`- ${aiStamp()} | model:${use.model||'?'} | resp:${use.resp||'?'} | calls:${use.calls} | in:${use.in} | cached:${use.cached} | out:${use.out} | reasoning:${use.reason} | total:${use.total} | cost:$${use.cost.toFixed(4)} | tools:${tools} | writes:${budget.writes} | ms:${ms}`;
  const ledger=await aiLogUsage(line);
  if(ledger){
    const ag=aiAggregates(ledger);
    $('ai-agg').innerHTML=`today $${ag.day.toFixed(2)}<br>month $${ag.mon.toFixed(2)}`;
    if(!aiWarned&&(ag.day>AI_BUDGET.day||ag.mon>AI_BUDGET.month)){
      aiWarned=true;
      aiChip('warn','BUDGET',(ag.day>AI_BUDGET.day
        ?`AI spend today $${ag.day.toFixed(2)} is past the $${AI_BUDGET.day.toFixed(2)} warning line`
        :`AI spend this month $${ag.mon.toFixed(2)} is past the $${AI_BUDGET.month.toFixed(2)} warning line`)
        +' — warning only; the OpenAI hard cap still governs.');
    }
  }
}

let aiWarned=false;
function aiMsg(cls,html){
  const d=document.createElement('div');d.className=cls;d.innerHTML=html;
  const log=$('ai-log');log.appendChild(d);log.scrollTop=1e9;

function aiHello(){aiMsg('ai-a','<div>Ask about today, the week, or any thread — or tell me what happened and I\'ll update KevinOS. Writes show up as green chips.</div>');}
function aiRenderConfirm(ch){
  const d=aiMsg('ai-confirm','');
  d.innerHTML=`<span class="ck">CONFIRM ${ch.length} CHANGE${ch.length===1?'':'S'}</span>`
    +ch.map(c=>`<div class="row">${esc(c.summary||c.tool)}</div>`).join('')
    +`<div style="display:flex;gap:8px;margin-top:10px"><button class="pk-btn" style="margin:0;flex:1;padding:11px" id="ai-apply">Apply all</button><button class="btn2" style="margin:0;flex:1;padding:11px" id="ai-skipc">Skip</button></div>`;
  d.querySelector('#ai-apply').onclick=async()=>{
    d.querySelector('#ai-apply').disabled=true;d.querySelector('#ai-skipc').disabled=true;
    let n=0;
    for(const c of aiPendingChanges||[]){
      let out;try{out=await AI_TOOLS[c.tool].run(c.args||{});}catch(e){out={error:String(e.message||e)};}
      if(out&&out.ok){n++;aiChip('',AI_TOOLS[c.tool].chip||c.tool,out.summary||'done');}
      else aiChip('err',(AI_TOOLS[c.tool].chip||c.tool)+' — FAILED',(out&&out.error)||'unknown error');
    }
    aiPendingChanges=null;d.remove();
    if(typeof updateBadge==='function')updateBadge();

async function aiShowAgg(){

async function askKevinOS(text){ /* voice later feeds this same entry point */
  text=String(text||'').trim();
  if(!text)return;
  if(!token())return;
  if(!aiProxyUrl()){aiChip('err','SETUP','No AI proxy URL — deploy ops/ai-proxy (DEPLOY.md in the data repo), then tap here again to paste it.');return;}
  if(!aiToken()){aiChip('err','SETUP','No proxy token — send again and paste the token created at deploy.');return;}
  aiMsg('ai-u',esc(text));
  $('ai-send').disabled=true;$('ai-in').disabled=true;
  const busy=aiMsg('ai-busy','thinking…');
  try{await aiTurn(text,busy);}
  catch(e){
    const m=String((e&&e.message)||e);
    // Safari says "Load failed" for any network/CORS-level fetch failure
    aiChip('err','ERROR',/load failed|failed to fetch|networkerror|aborted/i.test(m)
      ?`Couldn't reach the AI proxy (${m}). Check signal; test ${aiProxyUrl()||'the proxy URL'}/ping in the browser — it should say "unauthorized". If your setup got mangled, tap "reset AI" on the Dump tab and ask again.`
      :m);
  }
  busy.remove();
  $('ai-send').disabled=false;$('ai-in').disabled=false;$('ai-in').focus();
}

  localStorage.removeItem('ai_proxy_url');localStorage.removeItem('ai_proxy_token');
  aiConvClear();
  alert('AI setup cleared. Next "Ask KevinOS" will use the built-in proxy URL and ask for the token again.');
};
/* ==================== end Assistant ==================== */

/* ---- nav + render orchestration ---- */
let currentView='dump',lastRender=0;
const renderers={today:renderToday,cal:renderCal,money:renderMoney,peak:renderPeak,brief:renderBrief,edu:renderEdu};
const viewBody={today:'today-body',cal:'cal-body',money:'money-body',peak:'peak-body',brief:'brief-body',edu:'edu-body'};

/* two-pass render: paint cached data instantly, then refresh from network.
   offline → banner over cached view, or an error card with retry if nothing cached. */
async function runRender(name){
  const fn=renderers[name];if(!fn||!token())return;
  const bodyEl=$(viewBody[name]);
  // the initial "Loading…" container class centers + mutes ALL text; it must not
  // survive into rendered content (skeleton/empty/error states carry their own styles)
  bodyEl.classList.remove('loading');
  let painted=false;
  if(hasCache()){
    cacheOnly=true;
    try{await fn();painted=true;}catch(e){}
    cacheOnly=false;
  }
  usedStale=false;keepView=painted;
  try{
    await fn();lastRender=Date.now();
    if(usedStale)bodyEl.insertAdjacentHTML('afterbegin','<div class="stale">⚠ Offline — showing last synced data</div>');
  }catch(e){
    if(painted)bodyEl.insertAdjacentHTML('afterbegin','<div class="stale">⚠ Offline — showing last synced data</div>');
    else{
      bodyEl.innerHTML='';
      const c=card();c.innerHTML=`<div class="empty">Couldn't reach GitHub — ${esc(e.message||'network error')}. Check signal, then retry.</div>`;
      bodyEl.appendChild(c);
      const b=document.createElement('button');b.className='btn2';b.textContent='↻ Retry';
      b.onclick=()=>runRender(name);
      bodyEl.appendChild(b);
    }
  }
  keepView=false;
  updateBadge();
}

/* Today badge: remaining Top 3 when today's plan exists (counts down to zero as Kevin
   completes the plan); falls back to the due/priority count on days with no plan */
function updateBadge(){
  const st=top3State();
  let n;
  if(st)n=st.total-st.done;
  else{
    const t=todayStr();
    const tk=cacheGet('data/tasks.md'),lp=cacheGet('data/loops.md');
    n=0;
    if(tk)n+=parseChecklist(tk.text).filter(it=>{const d=meta(it.body,'due');return !it.checked&&((d&&d<=t)||meta(it.body,'pri')==='1');}).length;
    if(lp)n+=parseChecklist(lp.text).filter(it=>{const nd=meta(it.body,'nudge');return !it.checked&&nd&&nd<=t;}).length;
  }
  const btn=document.querySelector('nav button[data-v="today"]');
  let b=btn.querySelector('.nbadge');
  if(!n){if(b)b.remove();return;}
  if(!b){b=document.createElement('span');b.className='nbadge';btn.appendChild(b);}
  b.textContent=n>9?'9+':n;
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  currentView=b.dataset.v;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $('v-'+b.dataset.v).classList.add('active');
  runRender(b.dataset.v);
});

/* coming back to the app after 60s+ silently refreshes the current tab */
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&Date.now()-lastRender>60000&&renderers[currentView])runRender(currentView);
});

if(localStorage.getItem('gh_token')){refreshPending();updateBadge();}
</script>
</body>
