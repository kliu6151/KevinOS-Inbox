<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1120">
<title>KevinOS</title>
<!--
  KevinOS bar (2026-11-19). Kevin: "is there any way that we can have Kevin OS really be in like the background ...
  right now ... it's information on information." A thin window for the corner of the laptop: the one thing for
  right now, how many things need him, nothing else. Click to act; type to tell KevinOS. Opened as a small Edge app
  window (see the shortcut KevinOS gives him). Reads data/guide.json + data/desk.json + data/email-waiting.md from the
  private repo with the app's GitHub token (localStorage gh_token, same as the phone app). No data in this file.
-->
<style>
:root{--bg:#0b1120;--ink:#e8eef8;--ink2:#93a4bd;--line:rgba(140,170,220,.18);--accent:#38bdf8;--warn:#fbbf24}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.35 -apple-system,system-ui,"Segoe UI",sans-serif;overflow:hidden;user-select:none}
.hidden{display:none!important}
#bar{display:flex;flex-direction:column;gap:6px;padding:8px 10px;height:100%}
.row{display:flex;align-items:center;gap:8px;min-width:0}
#when{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;flex:none}
#now{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;cursor:pointer}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink);background:rgba(255,255,255,.04);cursor:pointer;font:inherit}
.chip b{color:var(--warn)}
.chip.quiet{color:var(--ink2)}
#tell{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:5px 8px;font:inherit;user-select:text}
#tell::placeholder{color:var(--ink2)}
#msg{color:var(--ink2);font-size:11px;flex:none}
#login{padding:10px;display:flex;gap:6px}#login input{flex:1;background:#111a2e;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px}
</style>
</head>
<body>
<div id="login" class="hidden"><input id="tok" type="password" placeholder="GitHub key (same as the phone app)"><button class="chip" id="saveTok">Save</button></div>
<div id="bar">
  <div class="row"><span id="when">…</span><span id="now" title="Open the start screen">loading</span></div>
  <div class="row">
    <button class="chip" id="needs" title="Open the Desk">…</button>
    <button class="chip quiet hidden" id="mail" title="Customers and people waiting on a reply">…</button>
    <input id="tell" placeholder="Tell KevinOS…" maxlength="500"><span id="msg"></span>
  </div>
</div>
<script>
const OWNER='kliu6151',REPO='KevinOS',APP='https://kliu6151.github.io/KevinOS-Inbox/';
const $=id=>document.getElementById(id);
const ls=k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}};
const token=()=>ls('gh_token');
const dec=b=>decodeURIComponent(escape(atob(String(b).replace(/\n/g,''))));
const enc=s=>btoa(unescape(encodeURIComponent(s)));
async function api(path,opt={}){const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/${path}`,{cache:'no-store',...opt,headers:{'Authorization':`Bearer ${token()}`,'Accept':'application/vnd.github+json',...(opt.headers||{})}});if(r.status===401){$('login').classList.remove('hidden');throw new Error('login');}if(!r.ok)throw new Error(r.status);return r.json();}
const file=async p=>{try{return dec((await api(`contents/${p}`)).content);}catch(e){if(e.message==='login')throw e;return '';}};
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const h12=hm=>{let[h,m]=hm.split(':').map(Number);const ap=h>=12?'p':'a';h=h%12||12;return h+(m?':'+String(m).padStart(2,'0'):'')+ap;};
const open=u=>window.open(APP+u,'kevinos-main');

async function load(){
  if(!token()){$('login').classList.remove('hidden');return;}
  const [g,d,m]=await Promise.all([file('data/guide.json'),file('data/desk.json'),file('data/email-waiting.md')]);
  let G={},D={};try{G=JSON.parse(g);}catch(e){}try{D=JSON.parse(d);}catch(e){}
  // the one thing for right now: the plan block running now, else the next one, else the first to-do
  const t=nowHM(),plan=(G.plan||[]).filter(b=>b.time&&b.kind!=='buffer'&&b.kind!=='break');
  let cur=null;for(const b of plan){if(b.time<=t)cur=b;}
  const next=plan.find(b=>b.time>t);
  const pick=cur&&next&&next.time>t?cur:(next||cur);
  if(pick){$('when').textContent=(pick===cur?'now ':'')+h12(pick.time);$('now').textContent=pick.title;}
  else{const td=(G.todo||[])[0];$('when').textContent='next';$('now').textContent=td?(td.title||td.text||String(td)):'Nothing scheduled. Clear one thing from the Desk.';}
  // how many things need him (the Desk's "need you" tile), never a list
  const tl=D.tiles||{},needs=+tl.needs||0;
  $('needs').innerHTML=needs?`<b>${needs}</b> need you`:'nothing needs you';
  const w=(m.match(/·\s*(\d+)\s+waiting on you/)||[])[1];
  if(w&&+w>0){$('mail').classList.remove('hidden');$('mail').textContent=`✉ ${w} waiting`;}else $('mail').classList.add('hidden');
}
$('now').onclick=()=>open('start.html');
$('needs').onclick=()=>open('desk.html');
$('mail').onclick=()=>open('desk.html');
$('saveTok').onclick=()=>{const v=$('tok').value.trim();if(!v)return;try{localStorage.setItem('gh_token',v);}catch(e){}$('login').classList.add('hidden');load().catch(()=>{});};
// tell KevinOS: one line becomes an inbox capture (the same path the phone's Dump tab uses)
$('tell').addEventListener('keydown',async e=>{
  if(e.key!=='Enter')return;const text=$('tell').value.trim();if(!text)return;
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const name=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}-bar`;
  $('msg').textContent='sending…';
  try{await api(`contents/inbox/${name}.md`,{method:'PUT',body:JSON.stringify({message:'bar: capture',content:enc(`[from the laptop bar]\n\n${text}\n`)})});$('tell').value='';$('msg').textContent='got it ✓';}
  catch(err){$('msg').textContent='not sent';}
  setTimeout(()=>$('msg').textContent='',4000);
});
load().catch(()=>{});setInterval(()=>load().catch(()=>{}),5*60*1000);
</script>
</body>
</html>
